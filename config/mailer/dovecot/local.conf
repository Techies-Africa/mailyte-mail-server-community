# Dovecot local overrides -- pulled in by dovecot.conf's trailing
# `!include_try /etc/dovecot/local.conf`, so it lands after everything else
# and can extend settings the baked image already defined.
#
# mail_crypt: mail migrated from mailcow is encrypted at rest. mailcow runs
# Dovecot's mail_crypt plugin with a *global* key pair
# (mail_crypt_global_private_key in its own dovecot config), so every message
# file it stores begins with the literal bytes "CRYPTED" rather than RFC822
# headers. Copying the Maildir across therefore copies ciphertext: without
# the plugin and the same keys, Dovecot reports
#   "Cached message size larger than expected (1884 > 1604)"
# and every FETCH fails, even though SEARCH still counts the messages -- so a
# mailbox looks populated and reads empty.
#
# The keys are the ones from the source system, mounted read-only. Because
# they are global rather than per-user, they decrypt every migrated mailbox.
#
# mail_crypt_save_version = 2 keeps NEW mail encrypted too, matching how the
# source system stored it. Setting it to 0 would write new mail in the clear
# while still reading the old -- do that only as a deliberate step away from
# encryption at rest, not by accident.
# zlib: the source system also compressed message bodies (`zlib_save = lz4`),
# so decrypting a migrated message yields an LZ4 stream beginning
# "Dovecot-LZ4", not RFC822. Both layers are needed to read the mail, and
# with only mail_crypt loaded the result looks *almost* right -- LZ4 leaves
# literal runs intact, so headers appear half-readable among binary. Easy to
# misread as a decryption failure rather than a missing second layer.
#
# acl: shared mailboxes. Until this was added, a shared mailbox accepted mail
# and filed it into a Maildir no human could open -- there was no shared
# namespace and no ACL plugin, so the four permission levels the UI offers
# enforced nothing at all. See the `namespace shared` block below.
#
# mail_crypt is a precondition for this working, and it happens to hold: the
# keys are GLOBAL, not per-user, so any authenticated session can decrypt any
# mailbox. Were they per-user, sharing would additionally need
# mail_crypt_acl (lib05_mail_crypt_acl_plugin.so, present in the image) to
# re-wrap each mailbox key for each reader.
mail_plugins = $mail_plugins mail_crypt zlib acl

protocol imap {
  mail_plugins = $mail_plugins mail_crypt zlib imap_zlib acl
}

protocol lmtp {
  mail_plugins = $mail_plugins mail_crypt zlib acl
}

# Deliberately NOT loading imap_acl. That plugin exposes IMAP SETACL/DELETEACL
# so a mail client could rewrite the rights itself -- which would both bypass
# the permission levels set in the dashboard and make Dovecot try to WRITE to
# acl_shared_dict, whose backing store here is a read-only view.
# Membership is changed in one place: the shared-mailbox UI.

plugin {
  mail_crypt_global_private_key = </etc/dovecot/mail_crypt/ecprivkey.pem
  mail_crypt_global_public_key = </etc/dovecot/mail_crypt/ecpubkey.pem
  mail_crypt_save_version = 2
  # Matches the source system, so newly delivered mail is stored the same way
  # the migrated mail already is.
  zlib_save = lz4

  # Rights live in a `dovecot-acl` file inside each shared mailbox's Maildir.
  # vfile is Dovecot's only ACL backend -- there is no SQL option -- which is
  # why shared-mailbox-acl-sync.py exists to write those files from
  # shared_mailbox_members.
  acl = vfile

  # A mailbox with no ACL file of its own inherits INBOX's. That is what lets
  # the syncer write ONE file per shared mailbox and still have Sent, Archive
  # and any folder a member creates later carry the same permissions.
  acl_defaults_from_inbox = yes

  # Which shared mailboxes to LIST for a given user. Backed by a SQL dict over
  # a view of shared_mailbox_members (see dovecot-dict-acl.conf.ext), so
  # discovery reads live truth and needs no synchronisation -- add a member in
  # the dashboard and the folder is listed on their next connection.
  acl_shared_dict = proxy::acl
}

dict {
  acl = mysql:/etc/dovecot/dovecot-dict-acl.conf.ext
}

# The dict socket has to be reachable by the MAIL processes, which run as
# vmail (uid 5000), not by the internal dovecot user that owns /run/dovecot.
#
# Without this the default listener is 0600 root:root and every lookup fails
# with
#   net_connect_unix(/run/dovecot/dict) failed: Permission denied
#   (euid=5000(vmail) ... we're not in group 104(dovecot))
# which does NOT surface as an access error: the shared mailbox simply never
# appears in the folder list, while opening it by its exact name still works
# (rights come from the vfile ACL, which needs no dict). A shared mailbox that
# is invisible but reachable is a confusing failure to diagnose, so this
# listener is load-bearing, not tidiness.
service dict {
  unix_listener dict {
    mode = 0660
    user = vmail
    group = vmail
  }
}

# The shared mailbox appears to each member as, for example,
#   Shared/sales@mailyte.com/INBOX
#
# `%%u` is the OWNER (the shared address), as distinct from `%u`, the person
# logged in -- so one namespace definition covers every shared mailbox a user
# can reach. location resolves through the owner's own userdb lookup, which
# is why `maildir:%%h` is correct here: user_query already returns the Maildir
# as the home directory.
#
# INDEX puts each reader's index files under their OWN home (`%h`), keyed by
# the owner (`%%u`), rather than letting every member scribble cache files
# into the shared mailbox's directory.
#
# Deliberately INDEX and not INDEXPVT. With Maildir, \Seen lives in the
# message FILENAME, so it is shared between members either way -- INDEXPVT
# would add a private per-user flag store and split it. Shared \Seen is the
# documented behaviour ("Everyone you add sees the same mail in the same
# place") and the point of a team mailbox: you can tell that a colleague has
# already picked a message up.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/%%u/
  location = maildir:%%h:INDEX=%h/shared/%%u
  subscriptions = yes
  # Only list a shared mailbox when the user actually has rights on it,
  # rather than advertising every shared address on the server.
  list = children
}

# Show the shared mailbox's INBOX as an explicit child rather than collapsing
# it onto the prefix itself. Clients handle the explicit form far more
# consistently, and it leaves room for Sent/Archive beside it.
mail_shared_explicit_inbox = yes
