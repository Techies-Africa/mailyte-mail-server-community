# Dovecot local overrides -- pulled in by dovecot.conf's trailing
# `!include_try /etc/dovecot/local.conf`, so it lands after everything else
# and can extend settings the baked image already defined.
#
# mail_crypt: mail migrated from mailcow is encrypted at rest. mailcow runs
# Dovecot's mail_crypt plugin with a *global* key pair
# (mail_crypt_global_private_key in its own dovecot config), so every message
# file it stores begins with the literal bytes "CRYPTED" rather than RFC822
# headers. Copying the Maildir across therefore copies ciphertext: without
# the plugin and the same keys, Dovecot reports
#   "Cached message size larger than expected (1884 > 1604)"
# and every FETCH fails, even though SEARCH still counts the messages -- so a
# mailbox looks populated and reads empty.
#
# The keys are the ones from the source system, mounted read-only. Because
# they are global rather than per-user, they decrypt every migrated mailbox.
#
# mail_crypt_save_version = 2 keeps NEW mail encrypted too, matching how the
# source system stored it. Setting it to 0 would write new mail in the clear
# while still reading the old -- do that only as a deliberate step away from
# encryption at rest, not by accident.
# zlib: the source system also compressed message bodies (`zlib_save = lz4`),
# so decrypting a migrated message yields an LZ4 stream beginning
# "Dovecot-LZ4", not RFC822. Both layers are needed to read the mail, and
# with only mail_crypt loaded the result looks *almost* right -- LZ4 leaves
# literal runs intact, so headers appear half-readable among binary. Easy to
# misread as a decryption failure rather than a missing second layer.
mail_plugins = $mail_plugins mail_crypt zlib

protocol imap {
  mail_plugins = $mail_plugins mail_crypt zlib imap_zlib
}

protocol lmtp {
  mail_plugins = $mail_plugins mail_crypt zlib
}

plugin {
  mail_crypt_global_private_key = </etc/dovecot/mail_crypt/ecprivkey.pem
  mail_crypt_global_public_key = </etc/dovecot/mail_crypt/ecpubkey.pem
  mail_crypt_save_version = 2
  # Matches the source system, so newly delivered mail is stored the same way
  # the migrated mail already is.
  zlib_save = lz4
}
