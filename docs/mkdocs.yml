
site_name: !ENV [SITE_NAME, 'Mailyte Email Server Handbook']
site_description: !ENV [SITE_DESCRIPTION, 'The complete developer handbook for the Mailyte Email Server — everything you need to understand, build, and run the system.']
site_author: Mailyte Engineering Team
site_url: !ENV [SITE_URL, 'https://docs.mailyte.com']

repo_name: mailyte-email-server
repo_url: https://github.com/TechiesAfrica/mailyte-email-server
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024–2026 Mailyte by TechiesAfrica

# Theme configuration
theme:
  name: material
  language: en
  custom_dir: overrides

  # Custom font — modern, clean
  font:
    text: Inter
    code: JetBrains Mono

  # Color scheme
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  # Features
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

  # Custom icons
  icon:
    logo: material/email-fast
    repo: fontawesome/brands/github
    admonition:
      note: material/pencil-circle
      tip: material/lightbulb-on
      warning: material/alert-circle
      danger: material/fire-alert
      info: material/information
      example: material/test-tube

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - exclude:
      glob:
        - "Dockerfile"
        - "docker-compose.yml"
        - "supervisord.conf"
        - "requirements.txt"
        - ".env*"
        - "scripts/*"
        - "nginx/*"
        - "versions/*"
        - "includes/*"
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: TechiesAfrica
      repo: mailyte-email-server
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

# Extra CSS and JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

