
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:docs-builder]
command=/usr/local/bin/build-docs.sh
directory=/app
autostart=false
autorestart=false
user=root
stdout_logfile=/var/log/supervisor/docs-builder.log
stderr_logfile=/var/log/supervisor/docs-builder.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log
depends_on=docs-ssl-setup

[program:docs-ssl-setup]
command=/usr/local/bin/startup.sh
directory=/app
autostart=true
autorestart=false
startsecs=0
user=root
stdout_logfile=/var/log/supervisor/ssl-setup.log
stderr_logfile=/var/log/supervisor/ssl-setup.log

[program:ssl-monitor]
command=python3 /usr/local/bin/docs-ssl-manager.py monitor
directory=/app
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/ssl-monitor.log
stderr_logfile=/var/log/supervisor/ssl-monitor.log
depends_on=docs-ssl-setup

[program:cron]
command=cron -f
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron.log
