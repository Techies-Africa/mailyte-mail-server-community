[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --no-header
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    integration: tests that require running Docker services
    slow: tests that take >10 seconds (email delivery)
    security: security-related tests
    smoke: quick sanity checks (run first)
    xdist_group: group tests for serial execution in pytest-xdist
