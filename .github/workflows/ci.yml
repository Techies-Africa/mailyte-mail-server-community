name: Mailyte CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # Linting & Static Analysis
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        # ruff is PINNED: unpinned, every ruff release silently moved both the
        # format check and the ratchet count -- the lint job sat red for weeks
        # on formatter drift (which skipped `test` and let 99 paths of openapi
        # drift through), and the check count rose ~240 with zero code changes.
        # ruff-baseline.txt is measured under this exact version (re-baselined
        # 2026-08-30: 1017 -> 1228 under 0.16.5; the same tree scored -29 vs
        # its own HEAD, so the rise was pure version drift). Bumping the pin
        # means reformatting the repo and re-measuring the baseline in the
        # same commit.
        run: pip install ruff==0.16.5 mypy mypy-baseline types-redis types-requests

      - name: Check formatting with Ruff
        run: ruff format --check . --config pyproject.toml

      - name: Lint Python code with Ruff (ratchet -- count may only shrink)
        run: |
          COUNT=$(ruff check . --config pyproject.toml --output-format=json | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          BASELINE=$(cat ruff-baseline.txt)
          echo "ruff errors: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::ruff error count rose from $BASELINE to $COUNT (+$((COUNT - BASELINE))). Fix the new violation(s), or offset by fixing existing ones (Engineering Standards SS2.3: the baseline may only shrink)."
            ruff check . --config pyproject.toml --output-format=github || true
            exit 1
          elif [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::ruff error count dropped to $COUNT -- update ruff-baseline.txt to $COUNT so the ratchet doesn't drift back up."
          fi

      - name: Type check with mypy (progressive baseline -- may only shrink, never grow)
        run: bash scripts/run_mypy.sh | mypy-baseline filter

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh || true

  # ---------------------------------------------------------------------------
  # Unit & Integration Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: mailyte_test
          MYSQL_USER: mailuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt
          # Install project dependencies if they exist
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # worker/api's own deps (fastapi, pydantic, ...) -- tests/unit/test_auth.py
          # and tests/test_security_regressions.py (phase-07 7.13) both import from
          # worker/api/utils/auth.py, which needs fastapi to import at all.
          pip install -r worker/api/requirements.txt
          pip install diff-cover

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -ptestpass 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Apply database migrations
        run: |
          for f in database/migrations/sql/*.sql; do
            echo "Applying $f..."
            mysql -h 127.0.0.1 -u root -ptestpass mailyte_test < "$f"
          done
        env:
          MYSQL_PWD: testpass

      # No `|| true` here: test failures MUST fail CI. It sat on this step
      # for months, which meant every red suite still produced a green job.
      #
      # tests/test_dashboard.py is ignored explicitly (not silenced globally):
      # it is Flask-era code (`app.config["TESTING"]`) against what is now a
      # FastAPI app, so all 6 of its tests fail everywhere, and always did --
      # the old `|| true` just hid that. Fix or delete the file, then remove
      # this ignore.
      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --tb=short \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore=tests/load \
            --ignore=tests/integration_test.py \
            --ignore=tests/test_mail_flow.py \
            --ignore=tests/test_dashboard.py \
            --cov=shared \
            --cov=worker \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: testpass
          DB_NAME: mailyte_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          FLASK_ENV: testing
          PYTHONPATH: .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

      # No `if: always()` on the two coverage gates below: while the test step
      # ended in `|| true` it could never fail, so `always()` was a no-op.
      # Now that test failures fail the job, running the gates anyway would
      # only stack confusing secondary errors (coverage.xml missing or
      # partial after a collection crash) on top of the real one.
      - name: Coverage ratchet (repo total may not fall)
        run: |
          PCT=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100, 2))")
          BASELINE=$(cat coverage-baseline.txt)
          echo "line coverage: ${PCT}% (baseline: ${BASELINE}%)"
          if awk "BEGIN{exit !($PCT < $BASELINE)}"; then
            echo "::error::line coverage dropped from ${BASELINE}% to ${PCT}%. Coverage may only rise (Engineering Standards SS3: coverage is a ratchet)."
            exit 1
          fi

      - name: Diff coverage (changed code >= 60%)
        run: diff-cover coverage.xml --compare-branch=origin/develop --fail-under=60

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Docker Build Matrix
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mailer services
          - service: postfix
            context: mailer/postfix
          - service: dovecot
            context: mailer/dovecot
          - service: rspamd
            context: mailer/rspamd
          - service: cert_manager
            context: mailer/cert_manager
          # Worker services (simple context)
          - service: api
            context: worker/api
          - service: webhooks
            context: worker/webhooks
          - service: tracking
            context: worker/tracking
            dockerfile: worker/tracking/Dockerfile
            build_context: .
          - service: rag
            context: worker/rag
            dockerfile: worker/rag/Dockerfile
            build_context: .
          - service: storage_usage
            context: worker/storage_usage
            dockerfile: worker/storage_usage/Dockerfile
            build_context: .
          - service: delivery_optimizer
            context: worker/delivery_optimizer
          - service: encryption
            context: worker/encryption
          - service: archiver
            context: worker/archiver
            dockerfile: worker/archiver/Dockerfile
            build_context: .
          - service: jmap
            context: worker/jmap
          - service: migration
            context: worker/migration
            dockerfile: worker/migration/Dockerfile
            build_context: .
          - service: autoconfig
            context: worker/autoconfig
            dockerfile: worker/autoconfig/Dockerfile
            build_context: .
          - service: caldav
            context: worker/caldav
          - service: queue_manager
            context: worker/queue_manager
            dockerfile: worker/queue_manager/Dockerfile
            build_context: .
          - service: rate_limiter
            context: worker/rate_limiter
            dockerfile: worker/rate_limiter/Dockerfile
            build_context: .
          - service: activesync
            context: worker/activesync
          - service: analytics
            context: worker/analytics
            dockerfile: worker/analytics/Dockerfile
            build_context: .
          - service: dashboard
            context: worker/dashboard
          - service: templates
            context: worker/templates
          - service: url_protection
            context: worker/url_protection
          - service: oauth
            context: worker/oauth
          - service: monitoring
            context: worker/monitoring
            dockerfile: worker/monitoring/Dockerfile
            build_context: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -n "${{ matrix.dockerfile }}" ]; then
            DOCKERFILE="${{ matrix.dockerfile }}"
          elif [ -f "${{ matrix.context }}/Dockerfile" ]; then
            DOCKERFILE="${{ matrix.context }}/Dockerfile"
          else
            echo "No Dockerfile found for ${{ matrix.service }}, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "dockerfile=${DOCKERFILE}" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.service }}
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.build_context || matrix.context }}
          file: ${{ steps.check.outputs.dockerfile }}
          push: false
          tags: mailyte/${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Security Scanning
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit safety pip-audit

      - name: Bandit security scan
        run: |
          bandit -r shared/ worker/ security/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            -x "*/tests/*,*/test_*" \
            || true

      - name: Bandit summary
        if: always()
        run: |
          bandit -r shared/ worker/ security/ \
            --severity-level medium \
            --confidence-level medium \
            -x "*/tests/*,*/test_*" \
            -f screen \
            || true

      - name: Check dependencies for vulnerabilities
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --output pip-audit-report.json --format json || true
          fi
          if [ -f requirements-test.txt ]; then
            pip-audit -r requirements-test.txt --format json || true
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # ---------------------------------------------------------------------------
  # Docker Compose Validation
  # ---------------------------------------------------------------------------
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production override
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Validate development override
        run: |
          if [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          fi

      - name: Check for exposed secrets in compose files
        run: |
          ISSUES=0
          for f in docker-compose*.yml; do
            # Check for hardcoded passwords (excluding variable references)
            if grep -P '(?<![\$\{])password\s*[:=]\s*(?!\$\{)["\x27]?[a-zA-Z0-9]+' "$f" 2>/dev/null; then
              echo "WARNING: Possible hardcoded password in $f"
              ISSUES=$((ISSUES + 1))
            fi
          done
          if [ $ISSUES -gt 0 ]; then
            echo "::warning::Found $ISSUES potential hardcoded secrets in compose files"
          fi

  # ---------------------------------------------------------------------------
  # SQL Migration Validation
  # ---------------------------------------------------------------------------
  validate-sql:
    name: Validate SQL Migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: mailyte_test
          # 010_roundcube_db.sql / 011_sogo_db.sql GRANT to 'mailuser'@'%', which
          # every real deployment can do only because docker-compose's mysql
          # service already has MYSQL_USER/MYSQL_PASSWORD set (see .env.example),
          # so the account exists before init scripts run. Omitting them here
          # made this job fail on both files with "ERROR 1410: You are not
          # allowed to create a user with GRANT" -- a false failure caused by
          # the test harness not matching the real bootstrap, not a bad
          # migration (verified 2026-07-31 against a real MySQL 8 container).
          MYSQL_USER: mailuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -ptestpass 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Apply all migrations in order
        run: |
          FAILED=0
          for f in $(ls database/migrations/sql/*.sql | sort); do
            echo "Applying $f..."
            if mysql -h 127.0.0.1 -u root -ptestpass mailyte_test < "$f"; then
              echo "  OK: $f"
            else
              echo "  FAILED: $f"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED migration(s) failed"
            exit 1
          fi
        env:
          MYSQL_PWD: testpass

      - name: Verify schema integrity
        run: |
          echo "=== Tables ==="
          mysql -h 127.0.0.1 -u root -ptestpass mailyte_test -e "SHOW TABLES;"
          echo ""
          echo "=== Table count ==="
          TABLE_COUNT=$(mysql -h 127.0.0.1 -u root -ptestpass mailyte_test -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='mailyte_test';")
          echo "Total tables: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -eq 0 ]; then
            echo "::error::No tables created after migrations"
            exit 1
          fi
        env:
          MYSQL_PWD: testpass

      - name: Test rollback safety (check for DROP DATABASE)
        run: |
          for f in database/migrations/sql/*.sql; do
            if grep -qi "DROP DATABASE" "$f"; then
              echo "::error::Migration $f contains DROP DATABASE statement"
              exit 1
            fi
          done
          echo "All migrations pass rollback safety check"

  # ---------------------------------------------------------------------------
  # Alembic Migrations (phase-08) -- the job above only proves the frozen SQL
  # chain still applies to an empty database; it says nothing about whether
  # `alembic upgrade head` actually reaches head, or whether a database that
  # already has real data survives getting there. Both are what production
  # deploys and every CE upgrade actually do -- catching a destructive
  # migration here is the entire point (Engineering Standards SS1.2: the old
  # "Validate SQL Migrations" job green-lit 8 migrations that couldn't
  # initialize a database at all).
  # ---------------------------------------------------------------------------
  validate-migrations:
    name: Validate Alembic Migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: mailyte_migrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install alembic + migration dependencies
        run: pip install -r worker/api/requirements.txt

      - name: Fresh install -- alembic upgrade head must reach head cleanly
        run: python scripts/run_migrations.py
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mailyte_migrate_test
          DB_USER: root
          DB_PASSWORD: testpass

      - name: Fresh install is idempotent -- re-running is a no-op, not an error
        run: python scripts/run_migrations.py
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mailyte_migrate_test
          DB_USER: root
          DB_PASSWORD: testpass

      - name: Seed data, then prove upgrade-with-data (the gate that actually matters)
        run: |
          mysql -h 127.0.0.1 -u root -ptestpass mailyte_migrate_test -e "
            INSERT INTO organizations (id, name, active, created_at, updated_at)
              VALUES ('01CIUPGRADETEST0000000001', 'CI Upgrade Test Org', 1, NOW(), NOW());
            INSERT INTO domains (id, domain, organization_id, active, created_at, updated_at)
              VALUES ('01CIUPGRADETEST0000000002', 'ci-upgrade-test.example.com', '01CIUPGRADETEST0000000001', 1, NOW(), NOW());
          "
          alembic -c alembic.ini downgrade 0001_baseline
          COUNT_AFTER_DOWNGRADE=$(mysql -h 127.0.0.1 -u root -ptestpass mailyte_migrate_test -N -e \
            "SELECT COUNT(*) FROM organizations WHERE id='01CIUPGRADETEST0000000001'")
          if [ "$COUNT_AFTER_DOWNGRADE" -ne 1 ]; then
            echo "::error::Seeded organization row did not survive downgrade to 0001_baseline"
            exit 1
          fi
          python scripts/run_migrations.py
          COUNT_AFTER_UPGRADE=$(mysql -h 127.0.0.1 -u root -ptestpass mailyte_migrate_test -N -e \
            "SELECT COUNT(*) FROM organizations WHERE id='01CIUPGRADETEST0000000001'")
          if [ "$COUNT_AFTER_UPGRADE" -ne 1 ]; then
            echo "::error::Seeded organization row was lost re-upgrading to head -- this is a destructive migration"
            exit 1
          fi
          echo "Upgrade-with-data verified: seeded row survived downgrade and re-upgrade."
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mailyte_migrate_test
          DB_USER: root
          DB_PASSWORD: testpass
          MYSQL_PWD: testpass

  # ---------------------------------------------------------------------------
  # OpenAPI Contract (phase-05) -- two gates:
  #   1. openapi.json (committed, task 5.4) must match what the app actually
  #      generates -- a stale committed spec is worse than none, it's a
  #      *wrong* contract CE users and Laravel's client generator would trust.
  #   2. The untyped-response-schema count may only shrink, never grow (SS5.1's
  #      two-tier target: the 56-endpoint consumed set is fully typed now,
  #      everything else is a ratchet, not a one-time fix).
  # Doesn't need a live database -- app.openapi() is pure route/model
  # introspection, no DB calls happen at import time. It DOES need a
  # DB_PASSWORD that clears startup_checks.py's verify_secrets() (16+ chars,
  # not a known-weak literal) since app.py runs that check on import,
  # regardless of whether anything actually connects.
  # ---------------------------------------------------------------------------
  # Deliberately NOT `needs: lint`: this job sat skipped behind a red lint
  # job for weeks while 99 paths of spec drift accumulated -- a skipped gate
  # is an open gate. It needs nothing lint produces, so it runs regardless.
  validate-openapi-contract:
    name: Validate OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install worker/api's own deps
        run: pip install -r worker/api/requirements.txt

      # app.py registers route modules inside try/except and skips any that
      # fail to import -- so a module that blows up in this minimal env (it
      # sets only DB_PASSWORD) would silently VANISH from the generated spec.
      # That is exactly how every /smtp-credentials path went missing: both
      # SMTP-credential modules built their DB engine at import time and
      # raised on the unset DB_* vars. The check below turns any silently
      # dropped router into a hard failure instead of a quietly smaller spec.
      - name: Generate the current spec (every router must register)
        working-directory: worker/api
        run: |
          python -c "
          import json, sys
          from app import app, route_modules
          registered_tags = {t for r in app.routes for t in (getattr(r, 'tags', None) or [])}
          missing = [m for m, _p, tag in route_modules if tag not in registered_tags]
          if missing:
              print('::error::route module(s) failed to register, the spec would silently'
                    ' lose their paths: ' + ', '.join(missing)
                    + '. Check the import-time errors logged above -- route modules must'
                    ' not touch DB/env at import (build engines lazily).')
              sys.exit(1)
          json.dump(app.openapi(), open('/tmp/current-openapi.json', 'w'), indent=2, sort_keys=True)
          "
        env:
          DB_PASSWORD: ci-openapi-contract-check-placeholder

      - name: Committed openapi.json must match the generated spec
        run: |
          python -c "
          import json
          committed = json.load(open('openapi.json'))
          current = json.load(open('/tmp/current-openapi.json'))
          json.dump(committed, open('/tmp/committed-sorted.json', 'w'), indent=2, sort_keys=True)
          "
          if ! diff -q /tmp/committed-sorted.json /tmp/current-openapi.json > /dev/null 2>&1; then
            echo "::error::openapi.json is out of date. Regenerate and commit it (task 5.4):"
            echo "  python -c \"import json; from worker.api.app import app; json.dump(app.openapi(), open('openapi.json','w'), indent=2, sort_keys=True)\""
            diff /tmp/committed-sorted.json /tmp/current-openapi.json | head -80 || true
            exit 1
          fi
          echo "openapi.json is in sync with the live spec."

      - name: Untyped-response ratchet -- may only shrink, never grow
        run: |
          python - <<'PY'
          import json
          spec = json.load(open('openapi.json'))
          empty = []
          for p, ops in spec['paths'].items():
              for m, op in ops.items():
                  if m not in ('get', 'post', 'put', 'delete', 'patch'):
                      continue
                  rs = op.get('responses', {})
                  ok = rs.get('200') or rs.get('201') or {}
                  sch = (ok.get('content', {}).get('application/json', {}) or {}).get('schema')
                  if not (sch and list(sch.keys()) != ['title']):
                      empty.append(f"{m.upper()} {p}")
          baseline = int(open('openapi-untyped-baseline.txt').read().strip())
          print(f"untyped endpoints: {len(empty)} (baseline: {baseline})")
          if len(empty) > baseline:
              new = len(empty) - baseline
              print(f"::error::untyped endpoint count rose from {baseline} to {len(empty)} (+{new}). "
                    f"A new endpoint needs a response_model, or an existing one needs typing to offset it "
                    f"(phase-05 SS5.1: the backlog may only shrink).")
              exit(1)
          elif len(empty) < baseline:
              print(f"::notice::untyped count dropped to {len(empty)} -- update openapi-untyped-baseline.txt "
                    f"to {len(empty)} so the ratchet doesn't drift back up.")
          PY

  # ---------------------------------------------------------------------------
  # Backup Script Validation
  # ---------------------------------------------------------------------------
  validate-scripts:
    name: Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint backup scripts
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script..."
            shellcheck -S warning "$script" || true
          done

      - name: Verify scripts are executable
        run: |
          for script in scripts/*.sh; do
            if [ ! -x "$script" ]; then
              echo "WARNING: $script is not executable"
            fi
          done

      - name: Test backup script --help
        run: |
          chmod +x scripts/backup.sh scripts/restore.sh
          bash scripts/backup.sh --help || true
          bash scripts/restore.sh --help || true

  # ---------------------------------------------------------------------------
  # Community Edition Generation
  #
  # The forcing function PARITY-AUDIT.md specified and nobody built. Its interim
  # rule -- port every fix(...) by hand, or carry a CE-skip: trailer -- was used
  # zero times, and 29 fixes were lost in the 13 days after the last port.
  #
  # This job asks a question discipline cannot be relied on to answer: can CE
  # still be generated from this commit, and does it still work? It does NOT
  # require CE to be in sync -- syncing happens at release. It requires that
  # publishing would succeed.
  # ---------------------------------------------------------------------------
  ce-generation:
    name: CE Generation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ce_local paths (CE's own Alembic chain above all) are restored from the
      # published repo rather than authored here, so the gate needs it present.
      #
      # Pinned to develop, NOT the repository default. CE's main is stuck at
      # 2026-07-28, 33 commits behind, carrying 1 of its 11 Alembic migrations.
      # Generating against it would restore a truncated chain and then propose
      # deleting ten migrations that published CE instances are sitting on.
      # (That main is this far behind is its own problem -- see
      # plans/02-mailyte-community/phase-06-ce-generation.md.)
      - uses: actions/checkout@v4
        with:
          repository: Techies-Africa/mailyte-mail-server-community
          ref: develop
          path: .ce-repo

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml
          pip install -r requirements-test.txt
          pip install -r worker/api/requirements.txt

      - name: Generate the Community Edition tree
        run: |
          python scripts/build-ce.py --out /tmp/ce --diff .ce-repo

      - name: Compile every generated module
        run: python -m compileall -q /tmp/ce

      - name: Run the generated tree's unit tests
        working-directory: /tmp/ce
        env:
          # startup_checks fails closed on weak or missing secrets, which is the
          # behaviour we want in production and an obstacle in CI. These are
          # throwaway values for this job only and reach nothing.
          DB_ROOT_PASSWORD: ci-only-Zx9Kq2Lm7Pv4Rt8Wn3Yb6
          DB_PASSWORD: ci-only-Hj5Tc8Nq1Ws4Ze7Rv2Mx9
          WEBHOOK_SECRET: ci-only-Qp3Lk6Bn9Dt2Fy5Gs8Jw1
          ADMIN_PASSWORD: ci-only-Vr7Mz4Cx1Hd8Kn5Tq2Lb6
          ADMIN_TOKEN_SECRET: ci-only-Nf2Yw5Jq8Rc3Vm6Pd9Xs4
        run: |
          PYTHONPATH="/tmp/ce:/tmp/ce/worker/api" \
            python -m pytest tests/unit tests/test_security_regressions.py \
            -q --no-header --timeout=60

      - name: Validate the generated compose project
        working-directory: /tmp/ce
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null --profile webmail config --quiet

      - name: Report what publishing would change
        run: |
          python scripts/build-ce.py --out /tmp/ce-pub --publish .ce-repo \
            | sed -n '/would publish/,$p'
