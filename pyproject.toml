[project]
name = "mailyte-email-server"
version = "0.1.0"
description = "Enterprise AI-powered email server platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.1",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "logging-config>=1.0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["database/migrations/archive", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["database/migrations/archive/", "alembic/versions/"]
