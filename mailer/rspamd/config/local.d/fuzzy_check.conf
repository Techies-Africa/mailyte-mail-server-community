# =============================================================================
# Rspamd Fuzzy Hashing — Near-Duplicate Spam Detection
#
# Compares message content against a database of known spam using fuzzy
# hashing. Even slightly modified spam variants are caught.
# Uses Redis for the local fuzzy storage backend.
# =============================================================================

# Local fuzzy storage (private to this installation)
rule "local" {
  algorithm = "mumhash";
  servers = "redis:6379";

  # Symbol definitions
  symbol = "LOCAL_FUZZY_UNKNOWN";
  mime_types = ["*"];

  # Maximum hash TTL (30 days)
  expire = 2592000;

  # Read and write (learn from our own traffic)
  read_only = false;

  # Skip messages smaller than 128 bytes
  min_bytes = 128;

  # Fuzzy matching thresholds
  max_score = 20.0;
  fuzzy_map = {
    LOCAL_FUZZY_DENIED {
      max_score = 20.0;
      flag = 1;
    }
    LOCAL_FUZZY_PROB {
      max_score = 10.0;
      flag = 2;
    }
    LOCAL_FUZZY_WHITE {
      max_score = 2.0;
      flag = 3;
    }
  }
}

# Rspamd.com public fuzzy storage (shared community data)
rule "rspamd.com" {
  algorithm = "mumhash";
  servers = "round-robin:fuzzy1.rspamd.com:11335,fuzzy2.rspamd.com:11335";

  symbol = "FUZZY_DENIED";
  mime_types = ["*"];

  # Public is read-only
  read_only = true;

  # Higher weight for community-confirmed spam
  max_score = 20.0;
  fuzzy_map = {
    FUZZY_DENIED {
      max_score = 20.0;
      flag = 1;
    }
    FUZZY_PROB {
      max_score = 10.0;
      flag = 2;
    }
    FUZZY_WHITE {
      max_score = 2.0;
      flag = 3;
    }
  }
}
