# DMARC — verify inbound DMARC policies
#
# Checks SPF/DKIM alignment and applies sender domain's DMARC policy.

enabled = true;

# Reporting — send aggregate DMARC reports
reporting = false;

# Actions based on DMARC policy
actions {
    quarantine = "add_header";
    reject = "reject";
    softfail = "add_header";
}
