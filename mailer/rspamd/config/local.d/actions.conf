# =============================================================================
# Rspamd Spam Action Thresholds — Global Defaults
# Per-organization overrides are applied via the settings module (settings.conf)
# =============================================================================

# Reject — hard reject (score >= 15, definitely spam)
reject = 15;

# Rewrite subject — prepend [SPAM] to subject (score >= 10)
rewrite_subject = 10;

# Add header — add X-Spam: Yes header (score >= 6, Dovecot Sieve routes to Junk)
add_header = 6;

# Greylist — temporary rejection for unknown senders (score >= 4)
greylist = 4;

# Subject pattern for rewrite_subject action
subject = "[SPAM] %s";
