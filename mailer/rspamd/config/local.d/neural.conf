# =============================================================================
# Rspamd Neural Network Module — ML-Based Spam Detection
#
# Uses a neural network trained on Bayesian classifier data to improve
# spam detection accuracy over time. Requires sufficient training data
# (min_spam + min_ham messages) before activating.
# =============================================================================

enabled = true;

rules {
  NEURAL_SPAM {
    train {
      max_trains = 1000;
      max_usages = 20;
      max_iterations = 25;
      learning_rate = 0.01;

      # Minimum messages needed before neural network activates
      spam_score = 8;
      ham_score = -2;
    }

    # Use Redis for model storage
    redis {
      servers = "redis:6379";
      prefix = "rn_";
    }

    # Scoring output
    symbol_spam = "NEURAL_SPAM";
    symbol_ham = "NEURAL_HAM";

    # Number of input neurons (auto-detected from symbols)
    ann_expire = 86400;
  }
}
