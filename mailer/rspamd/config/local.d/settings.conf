# =============================================================================
# Rspamd Settings Module — Per-Organization Spam Policies
#
# Allows each organization to have custom spam thresholds, whitelists,
# and quarantine rules. Settings are stored in Redis and synced from MySQL
# by the sync_rspamd_settings.py script.
#
# How it works:
#   1. Organizations configure spam settings via API (stored in MySQL)
#   2. sync_rspamd_settings.py reads from MySQL → writes to Redis
#   3. Rspamd reads per-recipient settings from Redis at scan time
#   4. Each org can have different reject/quarantine/greylist thresholds
# =============================================================================

# Enable the settings module
enabled = true;

# Redis-backed settings for per-organization policies
# Format: rspamd_settings:{id} → JSON settings object
redis {
  servers = "redis:6379";
}

# ID prefix for organization settings in Redis
id_prefix = "rspamd_settings:";

# Default settings for organizations without custom policies
# (uses global actions.conf thresholds)
