
# Greylisting configuration for spam reduction
# Delays mail from unknown senders, reducing spam significantly

enabled = true;

# Greylisting timeouts
timeout = 300;          # 5 minutes initial delay
expire = 86400;         # 24 hours to remember greylisted entries
expire_whitelist = 604800; # 7 days to remember whitelisted entries

# Whitelist settings
whitelist_symbols = [
  "DKIM_VALID",
  "DKIM_VALID_AU", 
  "DMARC_POLICY_ALLOW",
  "SPF_ALLOW"
];

# Skip greylisting for authenticated users
skip_authenticated = true;
skip_local = true;

# Database backend (Redis)
servers = "redis:6379";
prefix = "rg";

# Greylisting thresholds
threshold = 1.0;        # Greylist if spam score >= 1.0
action = "greylist";

# Custom message for greylisted mail
message = "Greylisted for %d seconds";

# IP whitelist (trusted mail servers)
whitelist_domains_url = [
  "https://maps.rspamd.com/rspamd/surbl-whitelist.inc.local",
  "$LOCAL_CONFDIR/local.d/whitelist_domains.map"
];

# Per-domain greylisting settings
per_domain_whitelist = true;
