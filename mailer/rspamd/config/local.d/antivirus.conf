
# ClamAV antivirus integration for Rspamd
#
# IMPORTANT: ClamAV is NOT deployed by default.
# To enable antivirus scanning:
#   1. Add a 'clamav' service to docker-compose.yml (image: clamav/clamav)
#   2. Change 'enabled' to true below
#   3. Update 'servers' to point to the ClamAV container: "clamav:3310"
#
# Without ClamAV running, leaving this disabled prevents connection errors.

clamav {
  enabled = false;
  servers = "clamav:3310";
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  max_size = 20971520;
  timeout = 60.0;
  log_clean = false;
  retransmits = 2;
  cache_expire = 3600;
  symbol = "CLAM_VIRUS";
  type = "clamav";
  action = "reject";
}
