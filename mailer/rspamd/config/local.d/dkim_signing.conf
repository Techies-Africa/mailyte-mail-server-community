# DKIM Signing — sign outbound mail with per-domain keys
#
# Keys are stored at /var/lib/rspamd/dkim/{domain}.{selector}.key
# Generated by scripts/generate_dkim.py and shared via Docker volume.

enabled = true;

# Path template — Rspamd substitutes $domain and $selector
path = "/var/lib/rspamd/dkim/$domain.$selector.key";

# Default selector (overridden by selector_map for per-domain selectors)
selector = "default";

# Sign mail from authenticated users and local networks
sign_authenticated = true;
sign_local = true;

# Sign with the FULL From domain, not the effective second-level domain.
# false so a purpose-built subdomain gets its OWN DKIM identity and reputation
# lane: with esld collapsing, mail from @notify.mailyte.com signed as
# d=mailyte.com and inherited the parent's (damaged) reputation, defeating the
# reason the subdomain exists (verified 2026-09-06 -- a clean IP + perfect auth
# still spam-foldered because judgement is on the d= domain, not the IP).
# Safe here: every registered domain is a bare domain (full == esld, no change),
# and sending is constrained to registered domains, so no unregistered-subdomain
# sender loses its parent-key fallback.
use_esld = false;

# Strict sender matching
allow_hdrfrom_mismatch = false;
allow_username_mismatch = false;

# If a domain has no key, skip signing (don't reject)
# Sign using the `path` template above for any domain that has a key on
# disk. This was false, which disables the template entirely and signs only
# domains listed in selector_map -- and nothing ever writes that map (it
# still contains just its example comments), so rspamd signed *nothing*.
# Every domain on this server sent unsigned mail, which is what
# R_DKIM_NA on a receiving server means.
#
# true does not mean "sign without a key": rspamd still skips a domain whose
# key file is missing. It means new domains are signed automatically as soon
# as generate_dkim.py writes their key, with no second file to maintain.
try_fallback = true;

# Per-domain selector map (domain → selector)
# Populated by generate_dkim.py
selector_map = "/etc/rspamd/dkim_selectors.map";

# Signing algorithm
sign_algorithm = "rsa";
