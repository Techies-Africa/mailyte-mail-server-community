# Milter Headers — inject authentication results into messages
#
# Adds Authentication-Results and other informational headers.

use = ["authentication-results", "x-spam-status"];

authenticated_headers = ["authentication-results"];

# Remove existing upstream spam headers to prevent spoofing
remove_upstream_spam_flag_header = true;

# Extended headers — include custom headers set by Lua plugins
extended_headers_rcpt = ["X-Email-Category"];
