# =============================================================================
# Rspamd Phishing Detection
# Detects URL-based phishing, brand impersonation, and sender forgery
# =============================================================================

# Enable phishing detection
enabled = true;

# OpenPhish — community phishing URL feed
openphish_enabled = true;
openphish_premium = false;
openphish_map = "https://www.openphish.com/feed.txt";

# Phishtank — crowdsourced phishing database
phishtank_enabled = true;
phishtank_map = "https://data.phishtank.com/data/online-valid.json.bz2";

# Generic URL-based phishing detection
# Checks for URL display text that doesn't match the actual target
generic_service_url = "https://maps.rspamd.com/freemail/disposable.inc";
