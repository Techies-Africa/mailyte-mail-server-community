# ARC (Authenticated Received Chain) — sign forwarded mail
#
# ARC preserves authentication results across forwarding hops.
# Uses the same key infrastructure as DKIM signing.

enabled = true;

# Same key path and selector as DKIM
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector = "default";

# Sign authenticated and local mail
sign_authenticated = true;
sign_local = true;

# Use effective second-level domain
use_esld = true;

# Per-domain selector map (shared with DKIM)
selector_map = "/etc/rspamd/dkim_selectors.map";

sign_algorithm = "rsa";
