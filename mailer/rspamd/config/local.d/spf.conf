# =============================================================================
# Rspamd SPF Configuration
# Validates sender SPF records for inbound mail
# =============================================================================

# SPF is enabled by default in Rspamd, but we configure scoring
spf_cache_size = 2k;
spf_cache_expire = 1d;

# External SPF resolver (use Rspamd's built-in)
external_relay = [];

# Whitelist authenticated senders from SPF checks
whitelist_on_authenticated = true;
