# =============================================================================
# Rspamd Multimap — Per-Organization Sender Whitelists/Blacklists
#
# Organizations can maintain their own sender whitelists and blacklists.
# Maps are stored in Redis and synced from MySQL by sync_rspamd_settings.py.
# =============================================================================

# Per-org sender whitelist — reduces spam score for whitelisted senders
ORG_SENDER_WHITELIST {
  type = "from";
  map = "redis://redis:6379/3/org_sender_whitelist_${rcpt_domain}";
  prefilter = false;
  score = -5.0;
  description = "Organization sender whitelist — trusted senders";
}

# Per-org sender blacklist — increases spam score for blacklisted senders
ORG_SENDER_BLACKLIST {
  type = "from";
  map = "redis://redis:6379/3/org_sender_blacklist_${rcpt_domain}";
  prefilter = false;
  score = 10.0;
  description = "Organization sender blacklist — blocked senders";
}

# Per-org domain whitelist — entire domains trusted by the org
ORG_DOMAIN_WHITELIST {
  type = "header";
  header = "from";
  filter = "email:domain";
  map = "redis://redis:6379/3/org_domain_whitelist_${rcpt_domain}";
  prefilter = false;
  score = -3.0;
  description = "Organization domain whitelist — trusted sending domains";
}

# Global disposable email blocklist
DISPOSABLE_EMAIL {
  type = "from";
  filter = "email:domain";
  map = "https://maps.rspamd.com/freemail/disposable.inc";
  prefilter = false;
  score = 3.0;
  description = "Disposable/temporary email address domain";
}

# Global freemail detection (Gmail, Yahoo, etc.)
FREEMAIL_FROM {
  type = "from";
  filter = "email:domain";
  map = "https://maps.rspamd.com/freemail/free.inc";
  prefilter = false;
  score = 0.0;
  description = "Sender uses a freemail service (informational)";
}
