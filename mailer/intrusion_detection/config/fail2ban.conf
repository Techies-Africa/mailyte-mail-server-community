
#
# Fail2Ban Configuration for Enterprise Mail Server
# Provides intrusion detection and automatic IP blocking
#

[DEFAULT]
# Ban time in seconds (30 minutes default)
bantime = 1800

# Find time window in seconds (10 minutes)
findtime = 600

# Maximum retry attempts before ban
maxretry = 5

# Backend for storing ban information
backend = auto

# Log level
loglevel = INFO

# Log target
logtarget = /var/log/fail2ban.log

# Email notifications
destemail = admin@yourdomain.com
sender = fail2ban@yourdomain.com
mta = sendmail

# Action to take when ban occurs
action = %(action_mwl)s

# =============================================================================
# JAIL CONFIGURATIONS
# =============================================================================

# Postfix SMTP Authentication Failures
[postfix-auth]
enabled = true
port = smtp,465,587
filter = postfix-auth
logpath = /var/log/mail.log
maxretry = 3
bantime = 3600
findtime = 600
action = iptables-multiport[name=postfix-auth, port="smtp,465,587", protocol=tcp]
         webhook[name=postfix-auth]

# Dovecot Authentication Failures
[dovecot-auth]
enabled = true
port = pop3,pop3s,imap,imaps
filter = dovecot-auth
logpath = /var/log/dovecot.log
maxretry = 3
bantime = 3600
findtime = 600
action = iptables-multiport[name=dovecot-auth, port="pop3,pop3s,imap,imaps", protocol=tcp]
         webhook[name=dovecot-auth]

# Postfix Spam/Reject Attempts
[postfix-spam]
enabled = true
port = smtp,465,587
filter = postfix-spam
logpath = /var/log/mail.log
maxretry = 10
bantime = 7200
findtime = 3600
action = iptables-multiport[name=postfix-spam, port="smtp,465,587", protocol=tcp]
         webhook[name=postfix-spam]

# Rate Limiting Violations
[rate-limit]
enabled = true
port = smtp,465,587
filter = rate-limit
logpath = /var/log/mail.log
maxretry = 5
bantime = 1800
findtime = 300
action = iptables-multiport[name=rate-limit, port="smtp,465,587", protocol=tcp]
         webhook[name=rate-limit]

# Dovecot Brute Force
[dovecot-brute]
enabled = true
port = pop3,pop3s,imap,imaps
filter = dovecot-brute
logpath = /var/log/dovecot.log
maxretry = 5
bantime = 7200
findtime = 1800
action = iptables-multiport[name=dovecot-brute, port="pop3,pop3s,imap,imaps", protocol=tcp]
         webhook[name=dovecot-brute]
