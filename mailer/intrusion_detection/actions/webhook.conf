
# Webhook Action Configuration
# Sends security alerts via webhook

[Definition]
# Command to execute when banning IP
actionban = /usr/local/bin/fail2ban-webhook.py ban <ip> <name> <bantime>

# Command to execute when unbanning IP  
actionunban = /usr/local/bin/fail2ban-webhook.py unban <ip> <name>

# Command to check if action is available
actioncheck = 

# Command to start action
actionstart = 

# Command to stop action
actionstop = 

[Init]
# Name of the action
name = webhook

# Initialize webhook configuration
init = webhook
