
# Postfix Authentication Failure Filter
# Detects failed SASL authentication attempts

[Definition]
# Match failed authentication attempts
failregex = ^.* postfix/smtpd\[.*\]: warning: <HOST>\[.*\]: SASL (?:LOGIN|PLAIN|(?:CRAM|DIGEST)-MD5) authentication failed.*$
            ^.* postfix/smtpd\[.*\]: warning: <HOST>\[.*\]: SASL authentication failed.*$
            ^.* postfix/submission/smtpd\[.*\]: warning: <HOST>\[.*\]: SASL (?:LOGIN|PLAIN|(?:CRAM|DIGEST)-MD5) authentication failed.*$

# Ignore successful authentications
ignoreregex = authentication successful

[Init]
# How many seconds to look back in log
maxlines = 10

# Date template
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
