
# Dovecot Brute Force Detection Filter
# Detects sustained brute force attacks

[Definition]
# Match brute force patterns
failregex = ^.* dovecot: imap-login: Disconnected.*: Inactivity.*rip=<HOST>.*$
            ^.* dovecot: imap-login: Disconnected.*: Too many invalid auth attempts.*rip=<HOST>.*$
            ^.* dovecot: pop3-login: Disconnected.*: Too many invalid auth attempts.*rip=<HOST>.*$
            ^.* dovecot: auth-worker.*: .*authentication failed.*rip=<HOST>.*$

ignoreregex = 

[Init]
maxlines = 20
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
