
# Rate Limiting Violation Filter
# Detects rate limit violations and abuse

[Definition]
# Match rate limiting violations
failregex = ^.* postfix/smtpd\[.*\]: warning: .*\[<HOST>\]: rate limit exceeded.*$
            ^.* postfix/anvil\[.*\]: statistics: max connection rate .*\[<HOST>\].*$
            ^.* postfix/anvil\[.*\]: statistics: max message rate .*\[<HOST>\].*$
            ^.* rate_limit_policy: REJECT .*from.*\[<HOST>\].*rate limit exceeded.*$
            ^.* rate_limiter.*: Rate limit exceeded for <HOST>.*$

ignoreregex = 

[Init]
maxlines = 10
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
