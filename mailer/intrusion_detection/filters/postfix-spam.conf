
# Postfix Spam Detection Filter
# Detects spam and abuse attempts

[Definition]
# Match spam/reject patterns
failregex = ^.* postfix/smtpd\[.*\]: NOQUEUE: reject: RCPT from .*\[<HOST>\].*: 550 5\.1\.1.*$
            ^.* postfix/smtpd\[.*\]: NOQUEUE: reject: .*from .*\[<HOST>\].*: 554 .*$
            ^.* postfix/smtpd\[.*\]: reject: .*from .*\[<HOST>\].*$
            ^.* postfix/cleanup\[.*\]: .*from .*\[<HOST>\].*: reject.*$
            ^.* postfix/smtpd\[.*\]: warning: .*\[<HOST>\]: SASL.*authentication failed.*$
            ^.* postfix/smtpd\[.*\]: lost connection after .* from .*\[<HOST>\].*$

# Ignore legitimate rejections
ignoreregex = 

[Init]
maxlines = 15
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
