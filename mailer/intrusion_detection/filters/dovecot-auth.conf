
# Dovecot Authentication Failure Filter
# Detects failed IMAP/POP3 login attempts

[Definition]
# Match failed authentication attempts
failregex = ^.* auth-worker\(.*\): (?:.*:)?\s*(?:pam|passwd-file)\(.*,<HOST>(?:,.*)*\): (?:unknown user|invalid credentials|check failed).*$
            ^.* auth: (?:.*:)?\s*(?:pam|passwd-file)\(.*,<HOST>(?:,.*)*\): (?:unknown user|invalid credentials|check failed).*$
            ^.* auth-worker\(.*\): (?:.*:)?\s*(?:sql)\(.*,<HOST>(?:,.*)*\): (?:unknown user|invalid credentials|Password mismatch).*$
            ^.* dovecot: (?:auth|auth-worker).*authentication failed.*rip=<HOST>.*$
            ^.* dovecot: imap-login: (?:Disconnected|Aborted login).*rip=<HOST>.*$
            ^.* dovecot: pop3-login: (?:Disconnected|Aborted login).*rip=<HOST>.*$

# Ignore successful logins
ignoreregex = login successful

[Init]
maxlines = 20
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
