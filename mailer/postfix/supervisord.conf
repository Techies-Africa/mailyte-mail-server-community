
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postfix]
command=/usr/sbin/postfix start-fg
directory=/
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/postfix.log
stderr_logfile=/var/log/supervisor/postfix.log

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/rsyslog.log
stderr_logfile=/var/log/supervisor/rsyslog.log

# NOTE: tracking-injector and rate-limit-policy are NOT managed here.
# Postfix master process handles their lifecycle:
#   - tracking-filter: via pipe transport (forked per message)
#   - policy-rate-limit: via spawn transport (long-running subprocess)
