[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cert-manager]
command=python3 /usr/local/bin/cert_manager.py
directory=/usr/local/bin
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/cert-manager.log
stderr_logfile=/var/log/supervisor/cert-manager.log
startretries=5
startsecs=10

# NOTE: No cron needed — cert_manager.py has its own scheduling loop
# (CERT_CHECK_INTERVAL env var, defaults to 21600s / 6 hours)
