
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dovecot]
command=/usr/sbin/dovecot -F
directory=/
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/dovecot.log
stderr_logfile=/var/log/supervisor/dovecot.log

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/rsyslog.log
stderr_logfile=/var/log/supervisor/rsyslog.log

[program:dovecot-auth-policy]
command=python3 /usr/local/bin/dovecot-auth-policy.py
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=3
startretries=5

# Writes dovecot-acl files from shared_mailbox_members so the permission
# levels chosen in the dashboard are rights Dovecot enforces. Polls, because
# Dovecot's only ACL backend is vfile and `doveadm acl` is a ver1 command
# (not on the doveadm HTTP API), so nothing can push this from outside the
# container. See the script header.
[program:shared-mailbox-acl-sync]
command=python3 /usr/local/bin/shared-mailbox-acl-sync.py
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=3
startretries=5
