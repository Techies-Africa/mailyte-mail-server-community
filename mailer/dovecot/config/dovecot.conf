
##
## Dovecot Configuration — Mailyte Email Server
##
## Provides IMAP/POP3/LMTP/ManageSieve with MySQL virtual users,
## per-user quotas, Sieve filtering, and TLS encryption.
##
## LMTP (port 24) and Auth (port 24100) are exposed as TCP listeners
## for cross-container integration with Postfix.
##

# ==========================================================================
# PROTOCOL AND NETWORK
# ==========================================================================

protocols = imap pop3 lmtp sieve
listen = *, ::
disable_plaintext_auth = yes

# Trusted networks — bypass auth policy rate limiting for Docker internal
login_trusted_networks = 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16 127.0.0.0/8 [::1]/128

# Security: Login process logging for audit trail
login_log_format_elements = user=<%u> method=%m rip=%r lip=%l mpid=%e %c %k

# ==========================================================================
# LOGGING
# ==========================================================================

# Log to stderr for Docker log collection
log_path = /dev/stderr
info_log_path = /dev/stderr

auth_verbose = yes
auth_verbose_passwords = no
auth_debug = no
mail_debug = no
verbose_ssl = no

# ==========================================================================
# SSL/TLS
# ==========================================================================

ssl = required

ssl_cert = </etc/ssl/certs/server.crt
ssl_key = </etc/ssl/private/server.key
ssl_dh = </etc/dovecot/dh.pem

ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:ECDHE+CHACHA20:!aNULL:!MD5:!DSS:!RC4
ssl_prefer_server_ciphers = yes

# SNI — per-domain certs for enterprise custom hostnames (mail.clientdomain.com)
# cert_manager writes local_name {} blocks to /etc/ssl/sni/dovecot_sni.conf
# Entrypoint copies it to /etc/dovecot/conf.d/sni.conf on startup
# Dovecot reloads this on SIGHUP without dropping existing connections
!include_try /etc/dovecot/conf.d/sni.conf

# ==========================================================================
# AUTHENTICATION
# ==========================================================================

auth_mechanisms = plain login
auth_username_format = %Lu

# Auth caching for performance
auth_cache_size = 10M
auth_cache_ttl = 1 hour
auth_cache_negative_ttl = 1 min

# Delay after failed authentication (slows brute-force attacks)
auth_failure_delay = 2 secs

# Auth policy — Redis-backed brute-force protection
auth_policy_server_url = http://127.0.0.1:8090/
auth_policy_server_timeout_msecs = 2000
auth_policy_hash_mech = sha256
auth_policy_hash_truncate = 12
auth_policy_hash_nonce = mailyte_auth_nonce
auth_policy_request_attributes = login=%{requested_username} pwhash=%{hashed_password} remote=%{rip} device_id=%{client_id} protocol=%s
auth_policy_check_before_auth = yes
auth_policy_check_after_auth = yes
auth_policy_report_after_auth = yes
auth_policy_reject_on_fail = no

# MySQL-based authentication
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# ==========================================================================
# MAIL STORAGE
# ==========================================================================

mail_location = maildir:/var/mail/vhosts/%d/%n

mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000
mail_privileged_group = vmail

mail_fsync = optimized

# ==========================================================================
# NAMESPACE — Standard IMAP Folders
# ==========================================================================

namespace inbox {
  type = private
  separator = /
  inbox = yes

  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox "Sent Messages" {
    special_use = \Sent
    auto = no
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }

  # Smart Folders — Content-based email routing
  # Emails are classified by Rspamd (X-Email-Category header) and
  # routed by Sieve script at delivery time
  mailbox Notifications {
    auto = create
  }
  mailbox Social {
    auto = create
  }
  mailbox Promotions {
    auto = create
  }
  mailbox Updates {
    auto = create
  }
}

# ==========================================================================
# PLUGINS — Global
# ==========================================================================

mail_plugins = quota notify

# ==========================================================================
# PROTOCOL-SPECIFIC CONFIGURATION
# ==========================================================================

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 2 mins
  imap_client_workarounds = delay-newmail tb-extra-mailbox-sep
  imap_max_line_length = 64k
}

protocol pop3 {
  mail_max_userip_connections = 10
  pop3_uidl_format = %08Xu%08Xv
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
  pop3_fast_size_lookups = yes
  pop3_lock_session = yes
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@%d
}

# ==========================================================================
# QUOTA
# ==========================================================================

plugin {
  quota = maildir:User quota

  # Defaults — per-user quota from DB overrides via user_query quota_rule
  quota_rule = *:storage=5GB
  quota_rule2 = Trash:storage=+500MB
  quota_rule3 = Junk:storage=+100MB

  quota_grace = 10%%

  quota_warning = storage=95%% quota-warning 95 %u
  quota_warning2 = storage=80%% quota-warning 80 %u
  quota_warning3 = storage=75%% quota-warning 75 %u
}

service quota-warning {
  executable = script /usr/local/bin/dovecot-quota-warning.sh
  user = dovecot
  unix_listener quota-warning {
    user = vmail
    group = vmail
    mode = 0660
  }
}

# ==========================================================================
# SIEVE FILTERING
# ==========================================================================

plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_dir = ~/sieve
  sieve_global_dir = /etc/dovecot/sieve/global/
  sieve_global_path = /etc/dovecot/sieve/default.sieve
  sieve_extensions = +notify +imapflags +vacation-seconds +editheader
  sieve_max_script_size = 1M
  sieve_max_actions = 32
  sieve_max_redirects = 4
}

# ==========================================================================
# SERVICE DEFINITIONS
# ==========================================================================

# --- IMAP Login (ports 143/993) ---
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 2
  process_limit = 256
  client_limit = 1000
  service_count = 1
  chroot = login
  user = dovenull
  vsz_limit = 64M
}

service imap {
  process_limit = 1024
  client_limit = 1
  service_count = 0
  vsz_limit = 512M
}

# --- POP3 Login (ports 110/995) ---
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
  process_min_avail = 1
  process_limit = 128
  client_limit = 1000
  service_count = 1
  chroot = login
  user = dovenull
  vsz_limit = 64M
}

service pop3 {
  process_limit = 512
  client_limit = 1
  service_count = 1
}

# --- LMTP (port 24) — TCP listener for Postfix delivery ---
# Postfix connects via virtual_transport = lmtp:inet:dovecot:24
service lmtp {
  inet_listener lmtp {
    port = 24
    address = *
  }
  process_limit = 50
  client_limit = 1
  service_count = 0
}

# --- Anvil — connection tracking ---
service anvil {
  client_limit = 2000
}

# --- Auth (port 24100) — TCP listener for Postfix SASL ---
# Postfix connects via smtpd_sasl_path = inet:dovecot:24100
service auth {
  inet_listener {
    port = 24100
  }
  user = dovecot
  group = dovecot
  process_limit = 1
  client_limit = 4096
  vsz_limit = 256M
}

service auth-worker {
  process_limit = 30
  process_min_avail = 5
  user = vmail
  vsz_limit = 256M
}

# --- ManageSieve (port 4190) — Remote Sieve script management ---
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  process_min_avail = 0
  process_limit = 64
  client_limit = 500
  service_count = 1
  chroot = login
  user = dovenull
  vsz_limit = 64M
}

service managesieve {
  process_limit = 256
  client_limit = 1
  service_count = 1
}

# --- Stats ---
service stats {
  unix_listener stats-reader {
    user = vmail
    group = vmail
    mode = 0660
  }
  unix_listener stats-writer {
    user = vmail
    group = vmail
    mode = 0660
  }
}

# ==========================================================================
# PERFORMANCE AND DEFAULTS
# ==========================================================================

default_process_limit = 1000
default_client_limit = 1000
default_vsz_limit = 256M

default_login_user = dovenull
default_internal_user = dovecot

# ==========================================================================
# LOCAL OVERRIDES
# ==========================================================================

!include_try /etc/dovecot/local.conf
