
##
## Dovecot Configuration — Mailyte Email Server
##
## Provides IMAP/POP3/LMTP/ManageSieve with MySQL virtual users,
## per-user quotas, Sieve filtering, and TLS encryption.
##
## LMTP (port 24) and Auth (port 24100) are exposed as TCP listeners
## for cross-container integration with Postfix.
##

# ==========================================================================
# PROTOCOL AND NETWORK
# ==========================================================================

protocols = imap pop3 lmtp sieve
listen = *, ::
disable_plaintext_auth = yes

# Trusted networks — bypass auth policy rate limiting for Docker internal
login_trusted_networks = 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16 127.0.0.0/8 [::1]/128

# Security: Login process logging for audit trail
login_log_format_elements = user=<%u> method=%m rip=%r lip=%l mpid=%e %c %k

# ==========================================================================
# LOGGING
# ==========================================================================

# Log to stderr for Docker log collection
log_path = /dev/stderr
info_log_path = /dev/stderr

auth_verbose = yes
auth_verbose_passwords = no
auth_debug = no
mail_debug = no
verbose_ssl = no

# ==========================================================================
# SSL/TLS
# ==========================================================================

ssl = required

ssl_cert = </etc/ssl/certs/server.crt
ssl_key = </etc/ssl/private/server.key
ssl_dh = </etc/dovecot/dh.pem

ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:ECDHE+CHACHA20:!aNULL:!MD5:!DSS:!RC4
ssl_prefer_server_ciphers = yes

# SNI — per-domain certs for enterprise custom hostnames (mail.clientdomain.com)
# cert_manager writes local_name {} blocks to /etc/ssl/sni/dovecot_sni.conf
# Entrypoint copies it to /etc/dovecot/conf.d/sni.conf on startup
# Dovecot reloads this on SIGHUP without dropping existing connections
!include_try /etc/dovecot/conf.d/sni.conf

# ==========================================================================
# AUTHENTICATION
# ==========================================================================

auth_mechanisms = plain login
auth_username_format = %Lu

# Master-user proxy auth (RFC-less, Dovecot's own mechanism) -- lets the
# JMAP service (worker/jmap) open any mailbox's IMAP session as
# "<mailbox>*jmap_master" using ONLY the master's own password, without
# ever knowing the mailbox's real one. Exists because email_accounts.password
# is a one-way bcrypt hash (correct for real mailbox login) that nothing,
# including this server, can ever recover a plaintext password from --
# found live (01-mailyte-email-server phase-11 standalone webmail
# verification) breaking every JMAP call that needs real IMAP access
# (Mailbox/get, Email/query, etc.) via the platform Bearer-token auth path.
auth_master_user_separator = *

# Auth caching for performance
auth_cache_size = 10M
auth_cache_ttl = 1 hour
auth_cache_negative_ttl = 1 min

# Delay after failed authentication (slows brute-force attacks)
auth_failure_delay = 2 secs

# Auth policy — Redis-backed brute-force protection
auth_policy_server_url = http://127.0.0.1:8090/
auth_policy_server_timeout_msecs = 2000
auth_policy_hash_mech = sha256
auth_policy_hash_truncate = 12
auth_policy_hash_nonce = mailyte_auth_nonce
auth_policy_request_attributes = login=%{requested_username} pwhash=%{hashed_password} remote=%{rip} device_id=%{client_id} protocol=%s
auth_policy_check_before_auth = yes
auth_policy_check_after_auth = yes
auth_policy_report_after_auth = yes
auth_policy_reject_on_fail = no

# SMTP-only credential passdb (SMTP-credentials workstream). Checked first,
# but ONLY for the smtp protocol (Postfix's SASL connection, see the
# `service auth { inet_listener { port = 24100 } }` block below) --
# IMAP/POP3 logins never reach this block at all. `skip` has no
# "not found" value in real Dovecot (only never/authenticated/
# unauthenticated, confirmed against `doveconf -n`, which rejected an
# earlier attempt at `skip = notfound`) -- multiple passdbs already fall
# through to the next one by default when a username isn't found, so no
# extra directive is needed for that. Mailbox-password SMTP auth is
# unaffected either way, since it's a completely separate table.
protocol smtp {
  passdb {
    driver = sql
    args = /etc/dovecot/dovecot-sql-smtp.conf.ext
  }
}

# Master-user passdb -- verifies the JMAP service's own credential only;
# `pass = yes` then falls through to the SQL passdb below to confirm the
# impersonated mailbox actually exists, without checking its password.
passdb {
  driver = passwd-file
  master = yes
  pass = yes
  args = /etc/dovecot/master-users
}

# MySQL-based authentication
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# ==========================================================================
# MAIL STORAGE
# ==========================================================================

mail_location = maildir:/var/mail/vhosts/%d/%n

mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000
mail_privileged_group = vmail

mail_fsync = optimized

# ==========================================================================
# NAMESPACE — Standard IMAP Folders
# ==========================================================================

namespace inbox {
  type = private
  separator = /
  inbox = yes

  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox "Sent Messages" {
    special_use = \Sent
    auto = no
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }

  # Smart Folders — Content-based email routing
  # Emails are classified by Rspamd (X-Email-Category header) and
  # routed by Sieve script at delivery time
  mailbox Notifications {
    auto = create
  }
  mailbox Social {
    auto = create
  }
  mailbox Promotions {
    auto = create
  }
  mailbox Updates {
    auto = create
  }
}

# ==========================================================================
# PLUGINS — Global
# ==========================================================================

mail_plugins = quota notify

# ==========================================================================
# PROTOCOL-SPECIFIC CONFIGURATION
# ==========================================================================

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 2 mins
  imap_client_workarounds = delay-newmail tb-extra-mailbox-sep
  imap_max_line_length = 64k
}

protocol pop3 {
  mail_max_userip_connections = 10
  pop3_uidl_format = %08Xu%08Xv
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
  pop3_fast_size_lookups = yes
  pop3_lock_session = yes
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@%d
}

# ==========================================================================
# QUOTA
# ==========================================================================

plugin {
  quota = maildir:User quota

  # Defaults — per-user quota from DB overrides via user_query quota_rule
  quota_rule = *:storage=5GB
  quota_rule2 = Trash:storage=+500MB
  quota_rule3 = Junk:storage=+100MB

  quota_grace = 10%%

  quota_warning = storage=95%% quota-warning 95 %u
  quota_warning2 = storage=80%% quota-warning 80 %u
  quota_warning3 = storage=75%% quota-warning 75 %u
}

service quota-warning {
  executable = script /usr/local/bin/dovecot-quota-warning.sh
  user = dovecot
  unix_listener quota-warning {
    user = vmail
    group = vmail
    mode = 0660
  }
}

# ==========================================================================
# SIEVE FILTERING
# ==========================================================================

# Where Sieve sends outbound mail.
#
# Two Sieve actions have to SEND rather than file: `redirect` (mail
# forwarding) and `vacation` (auto-replies). Pigeonhole does that through a
# sendmail binary or an SMTP submission host, and this image has neither a
# sendmail nor, until now, a configured host -- so executing a redirect
# dropped the LMTP connection mid-delivery and Postfix deferred the message.
# Nothing was lost (the queue retries) but nothing forwarded either, and the
# failure looked like a Dovecot crash rather than a missing setting.
#
# Port 25, not the submission port. Submission (587) is configured
# `smtpd_client_restrictions = permit_sasl_authenticated, reject`, and Sieve
# has no credentials to offer -- it is the server acting on the user's
# behalf, not a mail client. Port 25 accepts it via permit_mynetworks (and
# postscreen_access_list = permit_mynetworks lets it past postscreen), which
# is what that rule exists for: internal containers delivering to local
# domains.
submission_host = postfix:25

plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_dir = ~/sieve
  # The envelope sender on a forwarded message. Using the recipient's own
  # address makes a bounce come back to them rather than to the original
  # sender, who did not choose to forward anything and can do nothing about
  # it -- and it keeps the forward from failing the destination's SPF check
  # against the original sender's domain.
  sieve_redirect_envelope_from = recipient
  sieve_global_dir = /etc/dovecot/sieve/global/
  sieve_global_path = /etc/dovecot/sieve/default.sieve
  sieve_extensions = +notify +imapflags +vacation-seconds +editheader +vnd.dovecot.pipe
  sieve_max_script_size = 1M
  sieve_max_actions = 32
  sieve_max_redirects = 4

  # Continuous mail archive, inbound half (DR-2). LMTP delivery is the only
  # point where inbound mail exists in plaintext on this host -- once Dovecot
  # writes the Maildir it is mail_crypt ciphertext -- so the global sieve pipes
  # a copy to the archiver from here.
  #
  # sieve_extprograms treats a non-zero exit from a piped program as a failed
  # sieve action, which fails the script, which makes LMTP return a temporary
  # error on a message we have already accepted. archive-message is written to
  # exit 0 unconditionally; this timeout is the backstop for the case where it
  # hangs rather than fails.
  sieve_plugins = sieve_extprograms
  sieve_pipe_bin_dir = /usr/lib/dovecot/sieve-pipe
  sieve_pipe_exec_timeout = 5s
}

# ==========================================================================
# SERVICE DEFINITIONS
# ==========================================================================

# --- IMAP Login (ports 143/993) ---
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 2
  process_limit = 256
  client_limit = 1000
  service_count = 1
  chroot = login
  user = dovenull
  vsz_limit = 64M
}

service imap {
  process_limit = 1024
  client_limit = 1
  service_count = 0
  vsz_limit = 512M
}

# --- POP3 Login (ports 110/995) ---
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
  process_min_avail = 1
  process_limit = 128
  client_limit = 1000
  service_count = 1
  chroot = login
  user = dovenull
  vsz_limit = 64M
}

service pop3 {
  process_limit = 512
  client_limit = 1
  service_count = 1
}

# --- LMTP (port 24) — TCP listener for Postfix delivery ---
# Postfix connects via virtual_transport = lmtp:inet:dovecot:24
service lmtp {
  inet_listener lmtp {
    port = 24
    address = *
  }
  process_limit = 50
  client_limit = 1
  service_count = 0
}

# --- Anvil — connection tracking ---
service anvil {
  client_limit = 2000
}

# --- Auth (port 24100) — TCP listener for Postfix SASL ---
# Postfix connects via smtpd_sasl_path = inet:dovecot:24100
service auth {
  inet_listener {
    port = 24100
  }
  user = dovecot
  group = dovecot
  process_limit = 1
  client_limit = 4096
  vsz_limit = 256M
}

service auth-worker {
  process_limit = 30
  process_min_avail = 5
  user = vmail
  vsz_limit = 256M
}

# --- doveadm HTTP API (internal bridge network only, never published) ---
# The platform API calls authCacheFlush here whenever an SMTP API key is
# revoked / re-enabled / rotated / updated / deleted (00-PRD-smtp-api-keys
# K1). Verified live on 2.3.16: a `nocache` passdb extra field is NOT
# honoured, so without this flush auth_cache_ttl (1 hour, above) keeps a
# revoked key authenticating from cache. The __DOVEADM_API_KEY__ sentinel
# is substituted by entrypoint.sh -- deliberately NOT ${...} syntax, which
# Dovecot's own config parser tries to expand and fails the build on (the
# SQL .ext files get away with ${...} because the sql driver parses them
# separately). When unset the listener answers 401 to everything and the
# API logs the degraded flush instead of failing the mutation.
service doveadm {
  inet_listener http {
    port = 24180
  }
}
doveadm_api_key = __DOVEADM_API_KEY__

# --- ManageSieve (port 4190) — Remote Sieve script management ---
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  process_min_avail = 0
  process_limit = 64
  client_limit = 500
  service_count = 1
  chroot = login
  user = dovenull
  vsz_limit = 64M
}

service managesieve {
  process_limit = 256
  client_limit = 1
  service_count = 1
}

# --- Stats ---
service stats {
  unix_listener stats-reader {
    user = vmail
    group = vmail
    mode = 0660
  }
  unix_listener stats-writer {
    user = vmail
    group = vmail
    mode = 0660
  }
}

# ==========================================================================
# PERFORMANCE AND DEFAULTS
# ==========================================================================

default_process_limit = 1000
default_client_limit = 1000
default_vsz_limit = 256M

default_login_user = dovenull
default_internal_user = dovecot

# ==========================================================================
# LOCAL OVERRIDES
# ==========================================================================

!include_try /etc/dovecot/local.conf
