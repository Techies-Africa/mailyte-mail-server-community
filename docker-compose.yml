
services:
  # Fail-closed secrets validation (C3) -- runs to completion before MySQL
  # initialises its data directory or the API starts.
  #
  # Every `${DB_PASSWORD:-mailpassword}`-style default in this file is a
  # publicly-known value in a public repository. Without this gate a
  # `docker compose up` on a fresh host produced a fully functional,
  # internet-facing mail server whose database root password was
  # `rootpassword` -- and said nothing about it.
  #
  # Ordering is the point. MySQL bakes MYSQL_ROOT_PASSWORD into its data
  # directory on first boot and ignores the variable on every boot after,
  # so a weak password caught *after* mysql starts is already permanent.
  # Hence `service_completed_successfully` on mysql below, not just on api.
  #
  # No custom image: worker/api/startup_checks.py is deliberately
  # stdlib-only, so a stock python:3.11-slim runs it bind-mounted.
  secrets-check:
    image: python:3.11-slim
    container_name: secrets-check
    environment:
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET:-}
    volumes:
      - ./worker/api/startup_checks.py:/check.py:ro
    command: ["python3", "/check.py"]
    restart: "no"

  # Redis Service - Caching, rate limiting, queues, Rspamd backend
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mailserver_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Service
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-mailserver}
      - MYSQL_USER=${DB_USER:-mailuser}
      - MYSQL_PASSWORD=${DB_PASSWORD:-mailpassword}
      - MYSQL_ROUNDCUBE_DATABASE=${ROUNDCUBE_DB_NAME:-roundcubemail}
    ports:
      - "${DB_PORT:-3306}:3306"
    # docker-entrypoint-initdb.d stays mounted here (phase-08) -- this repo's
    # first-boot path only ever runs it once on a truly empty data
    # directory. It produces exactly the 0001_baseline schema; the
    # `migrate` service below is what makes every schema change *after*
    # that reach a running deployment, including on upgrade -- initdb.d
    # alone cannot do that, which was the whole defect this phase exists
    # to fix. See mailyte-email-server's phase-08 build notes for why that
    # repo removes this mount entirely instead: it ships a service with an
    # ad-hoc-table race bad enough to justify it, this one doesn't.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations/sql:/docker-entrypoint-initdb.d
    # MySQL writes MYSQL_ROOT_PASSWORD into its data directory on first boot
    # and ignores the variable forever after. Validating secrets after this
    # container starts would therefore be too late to matter, so the gate is
    # a hard precondition rather than an advisory sibling.
    depends_on:
      secrets-check:
        condition: service_completed_successfully
    networks:
      - mailserver_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Schema migrations (phase-08) -- runs once per `up`, after MySQL is
  # healthy and before anything that touches the schema starts. A failed
  # migration must stop the deploy, not let a half-migrated API start:
  # `restart: "no"` plus every dependent service's
  # `condition: service_completed_successfully` (not just service_started)
  # is what enforces that.
  migrate:
    build:
      context: .
      dockerfile: ./worker/api/Dockerfile.migrate
    container_name: migrate
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-mailserver}
      - DB_USER=${DB_USER:-mailuser}
      - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mailserver_network
    restart: "no"

  # ========================================================================
  # Docker socket proxy (C1, 00-foundation/07-security-model.md) -- the *only*
  # thing in this stack that touches /var/run/docker.sock.
  #
  # cert_manager needs to SIGHUP postfix and dovecot after a certificate
  # rotation so they pick up the new TLS material without dropping
  # connections (see _reload_services() in
  # mailer/cert_manager/scripts/cert_manager.py). It needs nothing else the
  # Docker API exposes.
  #
  # It previously got that by bind-mounting the socket itself with `:ro`. That
  # flag only makes the *socket file* read-only; it does nothing to restrict
  # which Docker API calls a client can make once connected, so it was full
  # unrestricted API access -- which is equivalent to root on the host -- while
  # looking safe. This proxy is what actually narrows the surface, to exactly
  # "list/inspect containers, POST restart/stop/kill": no exec, no image
  # pulls, no volume or network access, no creating containers.
  #
  # On `internal_only`, not `mailserver_network`, so nothing else in the stack
  # can reach it even if it wanted to. No published port.
  # ========================================================================
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    # Upstream's own docs say --privileged is only needed under SELinux or
    # AppArmor enforcement that would otherwise lock a bind-mounted socket. H1
    # rules out `privileged: true` stack-wide, and the image starts and proxies
    # correctly without it. Add it back only if a specific host's mandatory
    # access control policy actually requires it -- not by default.
    environment:
      - CONTAINERS=1
      - POST=1
      - ALLOW_RESTARTS=1
      # Everything else defaults to 0: AUTH, SECRETS, EXEC, IMAGES, BUILD,
      # NETWORKS, VOLUMES, SERVICES, SWARM, NODES, PLUGINS, ...
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal_only
    restart: unless-stopped

  # Postfix - SMTP Server
  postfix:
     build: ./mailer/postfix
     container_name: postfix
     hostname: ${HOSTNAME:-mail.example.com}
     environment:
       - HOSTNAME=${HOSTNAME:-mail.example.com}
       - DOMAIN=${DOMAIN:-example.com}
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_NAME=${DB_NAME:-mailserver}
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - REDIS_HOST=redis
       - REDIS_PORT=6379
       - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-default}
       - DEFAULT_DOMAIN_ID=${DEFAULT_DOMAIN_ID:-default}
       - TRACKING_SERVICE_URL=http://tracking:8086
       - TRACKING_ENABLED=${TRACKING_ENABLED:-true}
       - WEBHOOK_SECRET=${WEBHOOK_SECRET:-webhooksecret}
       - WEBHOOK_SERVICE_URL=http://webhooks:8081
     ports:
       - "25:25"
       - "587:587"
       - "465:465"
     volumes:
       - ./storage/mail_data:/var/mail/vhosts
       - ./storage/ssl_certs:/etc/ssl/certs/custom
       - ./storage/ssl_private:/etc/ssl/private/custom
       - ./storage/sni_config:/etc/ssl/sni:ro
       - ./logs/mailer/postfix:/var/log/postfix
       - ./config/mailer/postfix:/etc/postfix/custom
     healthcheck:
       test: ["CMD-SHELL", "postfix status || exit 1"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 20s
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       redis:
         condition: service_healthy
       rspamd:
         condition: service_healthy
     networks:
       - mailserver_network
     restart: unless-stopped
     # H1 (00-foundation/07-security-model.md): postfix's master process
     # legitimately needs root to bind port 25 (<1024) and to chown/setuid per
     # recipient during local delivery -- that's Postfix's own internal
     # privilege-separation model (queue/pickup/local processes drop to the
     # postfix/postdrop system users the Dockerfile creates at build time), the
     # documented alternative to a blanket non-root USER for an MTA. So no
     # `USER` in mailer/postfix/Dockerfile -- capabilities are narrowed to
     # exactly what that model needs instead, never `privileged: true`.
     security_opt: ["no-new-privileges:true"]
     cap_drop: ["ALL"]
     # SYS_CHROOT is not optional: Postfix's pickup/tlsmgr/postscreen (and
     # smtpd, on real connections) all chroot() into /var/spool/postfix as part
     # of the privilege-separation model above. Without it every one of them
     # fatals on startup ("chroot(/var/spool/postfix): Operation not
     # permitted") and the service throttles forever -- found live in
     # mailyte-email-server, which is why it is listed explicitly here rather
     # than left to a generic hardening template.
     cap_add: ["NET_BIND_SERVICE", "CHOWN", "FOWNER", "SETUID", "SETGID", "DAC_OVERRIDE", "SYS_CHROOT"]

  # Dovecot - IMAP/POP3 Mail Server
  dovecot:
     build: ./mailer/dovecot
     container_name: dovecot
     ports:
       - "143:143"
       - "993:993"
       - "110:110"
       - "995:995"
       - "4190:4190"
     environment:
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_NAME=${DB_NAME:-mailserver}
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - REDIS_HOST=redis
       - REDIS_PORT=6379
     volumes:
       - ./storage/mail_data:/var/mail/vhosts
       - ./storage/ssl_certs:/etc/ssl/certs/custom
       - ./storage/ssl_private:/etc/ssl/private/custom
       - ./storage/sni_config:/etc/ssl/sni:ro
       - ./logs/mailer/dovecot:/var/log/dovecot
       - ./config/mailer/dovecot:/etc/dovecot/custom
     healthcheck:
       test: ["CMD-SHELL", "doveadm service status imap || exit 1"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 15s
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       redis:
         condition: service_healthy
     networks:
       - mailserver_network
     restart: unless-stopped
     # H1: same rationale as postfix -- Dovecot's login process needs root to
     # bind ports <1024 (110, 143) and to setuid/chown per mailbox owner, then
     # drops to its own unprivileged users for the actual IMAP/POP3 session.
     # Hence no `USER` in mailer/dovecot/Dockerfile, capabilities instead.
     security_opt: ["no-new-privileges:true"]
     cap_drop: ["ALL"]
     # SYS_CHROOT is load-bearing here too, and for a *different* reason than
     # postfix's: imap-login/pop3-login/anvil chroot() into
     # /run/dovecot/{login,empty} on every start, unconditionally -- not only
     # when a user logs in. Found live in mailyte-email-server: without it
     # every login/anvil process crash-loops (Errno 1 Operation not permitted)
     # and no IMAP/POP3/LMTP session can ever be established. A total outage,
     # and no healthcheck caught it -- which is exactly why this capability
     # list is copied from what EE actually settled on rather than derived.
     cap_add: ["NET_BIND_SERVICE", "CHOWN", "FOWNER", "SETUID", "SETGID", "DAC_OVERRIDE", "SYS_CHROOT"]

  # Rspamd - Anti-spam and Email Filtering
  rspamd:
     build: ./mailer/rspamd
     container_name: rspamd
     ports:
       - "11332:11332"
       - "11334:11334"
     environment:
       - REDIS_HOST=redis
       - REDIS_PORT=6379
     volumes:
       - rspamd_data:/var/lib/rspamd
       - ./storage/dkim_keys:/var/lib/rspamd/dkim
       - ./logs/mailer/rspamd:/var/log/rspamd
       - ./config/mailer/rspamd:/etc/rspamd/custom
     healthcheck:
       test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:11334/ping\")'"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 15s
     depends_on:
       redis:
         condition: service_healthy
     networks:
       - mailserver_network
     restart: unless-stopped
     # H1: rspamd binds no port <1024 and doesn't need to change file
     # ownership by uid the way postfix/dovecot do -- but the three
     # capabilities below are each required by something that was found live
     # in mailyte-email-server under `cap_drop: ALL` with no additions:
     #
     #   SETUID/SETGID -- rsyslogd (runs alongside rspamd via supervisord,
     #     mailer/rspamd/supervisord.conf) drops privileges internally the
     #     same way postfix/dovecot's own processes do. It looped "could not
     #     remove supplemental group IDs" without these.
     #   CHOWN -- entrypoint.sh chowns /var/log/rspamd and /var/lib/rspamd to
     #     _rspamd before dropping privileges, since both are bind-mounted
     #     from the host and shadow the ownership baked in at build time.
     #     Under cap_drop: ALL, UID 0 by itself does NOT gate that syscall --
     #     CAP_CHOWN does. Symptom: "cannot chown desired log file:
     #     /var/log/rspamd/rspamd.log, Operation not permitted", crash-looping
     #     to FATAL.
     #   DAC_OVERRIDE -- rspamd opens its own log file while still briefly
     #     root. Under cap_drop: ALL, plain UID 0 does not bypass permission
     #     bits; that bypass is specifically what CAP_DAC_OVERRIDE grants.
     #     Symptom: "cannot open desired log file ... Permission denied", and
     #     it persisted even with ownership and mode both already correct.
     #
     # The imklog module is disabled in the Dockerfile rather than re-granting
     # CAP_SYSLOG -- reading the *host* kernel ring buffer is not something
     # this container should be able to do at all.
     security_opt: ["no-new-privileges:true"]
     cap_drop: ["ALL"]
     cap_add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]

  # Certificate Manager - Let's Encrypt SSL
  cert_manager:
     build: ./mailer/cert_manager
     container_name: cert_manager
     ports:
       - "80:80"
     environment:
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_NAME=${DB_NAME:-mailserver}
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
       - HOSTNAME=${HOSTNAME:-mail.example.com}
       - DOMAIN=${DOMAIN:-example.com}
       - ACME_STAGING=${ACME_STAGING:-true}
       - SSL_CERT_PATH=/etc/ssl/certs
       - SSL_KEY_PATH=/etc/ssl/private
       - CERT_RENEWAL_DAYS=${CERT_RENEWAL_DAYS:-30}
       - CERT_CHECK_INTERVAL=${CERT_CHECK_INTERVAL:-21600}
       - SNI_CONFIG_PATH=/etc/ssl/sni
       # Live reload — send SIGHUP to Postfix/Dovecot after cert changes, via
       # the docker-proxy service above (C1) rather than a socket mount. The
       # `/var/run/docker.sock:...:ro` bind that used to be in the volumes list
       # below did not actually restrict anything — see the comment on
       # docker-proxy for why.
       - DOCKER_RELOAD_ENABLED=${DOCKER_RELOAD_ENABLED:-true}
       - DOCKER_PROXY_URL=http://docker-proxy:2375
       - POSTFIX_CONTAINER=postfix
       - DOVECOT_CONTAINER=dovecot
     volumes:
       - ./storage/ssl_certs:/etc/ssl/certs
       - ./storage/ssl_private:/etc/ssl/private
       - ./storage/sni_config:/etc/ssl/sni
       - letsencrypt_data:/etc/letsencrypt
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       # Not condition: service_healthy -- docker-proxy is a thin HAProxy
       # image with no HTTP tooling on board to build a meaningful healthcheck
       # from, and cert_manager doesn't need it up front anyway:
       # _reload_services() only calls it on demand when a cert actually
       # changes, and logs-and-continues on failure rather than crashing.
       docker-proxy:
         condition: service_started
     networks:
       - mailserver_network
       - internal_only
     restart: unless-stopped

  # API - Management REST API
  api:
     build: ./worker/api
     container_name: api
     ports:
       - "8083:8080"
     environment:
       - PORT=8080
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_NAME=${DB_NAME:-mailserver}
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - REDIS_HOST=redis
       - REDIS_PORT=6379
       - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpass}
       - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET:-tokensecret}
       - FLASK_ENV=${FLASK_ENV:-development}
       - FLASK_DEBUG=${FLASK_DEBUG:-1}
       # --- Mailyte Console / operator identity (ADR-002, ADR-004) ---------
       # Set false ONLY while bringing the console up over plain
       # http://localhost. With it true (the default) the operator session
       # cookie carries Secure, a browser on an http:// origin silently drops
       # it, and login appears to succeed and then bounce back to the sign-in
       # screen. Never false on a real deployment.
       - MAILYTE_COOKIE_SECURE=${MAILYTE_COOKIE_SECURE:-true}
       # MFA is mandatory for every operator (ADR-002 §3). ADR-004 allows one
       # escape hatch for a single-user homelab -- MAILYTE_CONSOLE_MFA=optional
       # -- and the default deliberately stays on. It only ever applies to an
       # operator who has not enrolled an authenticator at all; once enrolled,
       # MFA is enforced regardless.
       - MAILYTE_CONSOLE_MFA=${MAILYTE_CONSOLE_MFA:-required}
       - TOTP_ISSUER=${TOTP_ISSUER:-Mailyte}
       # Optional proxy targets. Left unset on purpose: this compose file
       # ships no monitoring or queue-manager container, and the API returns a
       # clear 503 naming the missing service rather than proxying to a
       # default that does not exist. Point these at your own services to
       # light up /api/v1/monitoring/* and /api/v1/queue/*.
       - MONITORING_SERVICE_URL=${MONITORING_SERVICE_URL:-}
       - QUEUE_SERVICE_URL=${QUEUE_SERVICE_URL:-}
     healthcheck:
       test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")'"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 15s
     volumes:
       # ── HOST OWNERSHIP REQUIREMENT (H1) ─────────────────────────────────
       # This mount, and the identical ones on webhooks, tracking and
       # rate_limiter, MUST be writable by UID 10001 -- the unprivileged user
       # those four Dockerfiles now run as. They stay host bind mounts rather
       # than named volumes on purpose: the fail2ban jail in
       # docs/security/intrusion-detection.md and the logrotate config in
       # docs/guides/troubleshooting/service-failures.md both read these paths
       # from the host, so moving them into Docker volumes would break
       # documented, security-relevant integration.
       #
       # shared/logging_config.py's ServiceLogger creates /app/logs/<service>/
       # at import time. It now degrades to stdout-only logging when that
       # directory is not writable, instead of raising out of the constructor
       # and crash-looping the service -- so getting the chown below wrong
       # costs you the log FILES, not the mail server.
       #
       # Still worth doing: without it these logs exist only in
       # `docker logs`, and the fail2ban jail in
       # docs/security/intrusion-detection.md reads them from the host.
       # Run once, before the first `docker compose up` (root, because chown
       # to another uid always requires it):
       #
       #   sudo chown -R 10001:10001 logs/worker/api logs/worker/webhooks \
       #                             logs/worker/tracking logs/worker/rate_limiter
       #
       # mailyte-email-server does the same thing from its deploy.sh; CE has no
       # equivalent deploy step, and start.sh cannot do it because it does not
       # run as root.
       # ────────────────────────────────────────────────────────────────────
       - ./logs/worker/api:/app/logs
       # H1 follow-through: worker/api/Dockerfile now runs this container as
       # UID 10001, and /app below is bind-mounted from the host source tree,
       # owned by whoever checked the repo out. app.py writes the single-use
       # operator bootstrap token to /app/data/operator-bootstrap-token and
       # removes it once consumed, and an unprivileged process cannot create
       # that subdirectory under a host-owned bind mount.
       #
       # A Docker-managed named volume, not a host directory: it takes its
       # ownership from the image's own /app/data (created and chowned to
       # 10001 in the Dockerfile) on first use, so it needs no host-side
       # chown. mailyte-email-server binds ./storage/api_data here instead and
       # has its deploy.sh chown it -- CE has no deploy step to hang that on,
       # a self-hoster just runs `docker compose up`, so the self-correcting
       # form is the right one for this edition.
       - api_data:/app/data
       - ./worker/api:/app
       - ./shared:/app/shared
       - ./database:/app/database
       # Key Encryption Key for the envelope-encrypted DKIM private keys (C2).
       # A file, never an env var: env vars leak through `docker inspect`, the
       # process list, and crash reporters, and this key decrypts every signing
       # key in the database.
       #
       # Created by scripts/generate_dkim_kek.sh, which start.sh runs. Without
       # it, create_domain() raises KEKNotConfiguredError -- caught, so the
       # domain is still created, but with NO DKIM key and a logged failure.
       - ./secrets/encryption_kek:/run/secrets/encryption_kek:ro
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       redis:
         condition: service_healthy
     networks:
       - mailserver_network
     restart: unless-stopped

  # Webhooks - Real-time Event Notifications
  webhooks:
     build: ./worker/webhooks
     container_name: webhooks
     # Task 7.0: host.docker.internal needs an explicit mapping on this
     # custom bridge network -- verified live in the sibling EE repo, same
     # network setup here. host-gateway is Docker's portable special value.
     extra_hosts:
       - "host.docker.internal:host-gateway"
     ports:
       - "8081:8081"
     environment:
       - WEBHOOK_URLS=${WEBHOOK_URLS:-http://0.0.0.0:5000/webhook/test}
       # Task 7.0 (03-mailyte-api/phase-07-tenant-surface.md, applied to CE
       # too): shared/webhook_dispatcher.py (imported here for dispatch_event())
       # reads WEBHOOK_URL, singular -- WEBHOOK_URLS above is a separate var
       # read directly by this service's own notification_sender.py. Without
       # this line dispatch_event() silently no-ops regardless of what a
       # self-hoster sets WEBHOOK_URLS to.
       - WEBHOOK_URL=${WEBHOOK_URLS:-}
       - WEBHOOK_SECRET=${WEBHOOK_SECRET:-webhooksecret}
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_NAME=${DB_NAME:-mailserver}
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - REDIS_HOST=redis
       - REDIS_PORT=6379
       - FLASK_ENV=${FLASK_ENV:-development}
       - FLASK_DEBUG=${FLASK_DEBUG:-1}
     healthcheck:
       test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"localhost\", 8081)); s.close()'"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 15s
     volumes:
       # Must be writable by UID 10001 -- see the HOST OWNERSHIP REQUIREMENT
       # block on the `api` service above. This container is one of the three
       # that crash-loops rather than degrades if it is not.
       - ./logs/worker/webhooks:/app/logs
       - ./worker/webhooks:/app
       - ./shared:/app/shared
       - ./database:/app/database
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       redis:
         condition: service_healthy
     networks:
       - mailserver_network
     restart: unless-stopped

  # Tracking - Email Open/Click Tracking
  tracking:
     build:
       context: .
       dockerfile: ./worker/tracking/Dockerfile
     container_name: tracking
     # Task 7.0: see the identical extra_hosts note on the `webhooks` service.
     extra_hosts:
       - "host.docker.internal:host-gateway"
     ports:
       - "8086:8086"
     environment:
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - DB_NAME=${DB_NAME:-mailserver}
       - REDIS_HOST=redis
       - REDIS_PORT=6379
       - TRACKING_DOMAIN=${HOSTNAME:-mail.example.com}
       - WEBHOOK_SECRET=${WEBHOOK_SECRET:-webhooksecret}
       - WEBHOOK_URLS=${WEBHOOK_URLS:-http://0.0.0.0:5000/webhook/test}
       # Task 7.0: see the identical comment on the `webhooks` service above.
       - WEBHOOK_URL=${WEBHOOK_URLS:-}
       - FLASK_ENV=${FLASK_ENV:-development}
       - FLASK_DEBUG=${FLASK_DEBUG:-1}
     volumes:
       # Must be writable by UID 10001 -- see the HOST OWNERSHIP REQUIREMENT
       # block on the `api` service above. Note the path: ./logs/tracking, not
       # ./logs/worker/tracking, which is what start.sh pre-creates -- so this
       # one is auto-created root-owned by Docker on first `up` unless it is
       # chowned explicitly.
       # logs/worker/tracking, not logs/tracking: this mount was the only one
       # in the repo missing the worker/ segment, so the directory start.sh,
       # quick-start.sh, mailyte-ctl.sh and docs/reference/log-formats.md all
       # create and document was never the one actually mounted. Docker then
       # created an empty root-owned logs/tracking/ instead.
       - ./logs/worker/tracking:/app/logs
       - ./worker/tracking:/app
       - ./shared:/app/shared
       - ./database:/app/database
     healthcheck:
       test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"localhost\", 8086)); s.close()'"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 15s
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       redis:
         condition: service_healthy
     networks:
       - mailserver_network
     restart: unless-stopped

  # Rate Limiter - Email Sending Rate Control
  rate_limiter:
    build:
      context: .
      dockerfile: ./worker/rate_limiter/Dockerfile
    container_name: rate_limiter
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-mailserver}
      - DB_USER=${DB_USER:-mailuser}
      - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"localhost\", 8082)); s.close()'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      # Must be writable by UID 10001 -- see the HOST OWNERSHIP REQUIREMENT
      # block on the `api` service above. start.sh does not pre-create this
      # path at all, so Docker auto-creates it root-owned on first `up`.
      - ./logs/worker/rate_limiter:/app/logs
      - ./shared:/app/shared
      - ./database:/app/database
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - mailserver_network
    restart: unless-stopped

  # Autoconfig - Email client auto-configuration
  autoconfig:
     build:
       context: .
       dockerfile: ./worker/autoconfig/Dockerfile
     container_name: autoconfig
     ports:
       - "8100:8100"
     environment:
       - PORT=8100
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_NAME=${DB_NAME:-mailserver}
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - HOSTNAME=${HOSTNAME:-mail.example.com}
       - DOMAIN=${DOMAIN:-example.com}
       - MTA_STS_MODE=${MTA_STS_MODE:-testing}
     healthcheck:
       test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"localhost\", 8100)); s.close()'"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 15s
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
     networks:
       - mailserver_network
     restart: unless-stopped

  # Email Templates
  templates:
     build: ./worker/templates
     container_name: templates
     ports:
       - "8095:8089"
     environment:
       - PORT=8089
       - DB_HOST=mysql
       - DB_PORT=3306
       - DB_NAME=${DB_NAME:-mailserver}
       - DB_USER=${DB_USER:-mailuser}
       - DB_PASSWORD=${DB_PASSWORD:-mailpassword}
     healthcheck:
       test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"localhost\", 8089)); s.close()'"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 15s
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
     networks:
       - mailserver_network
     restart: unless-stopped

  # ========================================================================
  # Webmail Clients (pick one or none — controlled via COMPOSE_PROFILES)
  #
  # Enable in .env:
  #   COMPOSE_PROFILES=roundcube        # Roundcube only
  #   COMPOSE_PROFILES=sogo             # SOGo only
  #   COMPOSE_PROFILES=roundcube,sogo   # Both
  #   (omit COMPOSE_PROFILES for no webmail)
  # ========================================================================

  # Roundcube — lightweight PHP webmail
  roundcube:
     image: roundcube/roundcubemail:latest
     container_name: roundcube
     profiles: ["roundcube"]
     ports:
       - "${ROUNDCUBE_PORT:-8880}:80"
     environment:
       - ROUNDCUBEMAIL_DEFAULT_HOST=dovecot
       - ROUNDCUBEMAIL_DEFAULT_PORT=143
       - ROUNDCUBEMAIL_SMTP_SERVER=tls://postfix
       - ROUNDCUBEMAIL_SMTP_PORT=587
       - ROUNDCUBEMAIL_SMTP_AUTH_TYPE=LOGIN
       - ROUNDCUBEMAIL_DB_TYPE=mysql
       - ROUNDCUBEMAIL_DB_HOST=mysql
       - ROUNDCUBEMAIL_DB_NAME=${ROUNDCUBE_DB_NAME:-roundcubemail}
       - ROUNDCUBEMAIL_DB_USER=${DB_USER:-mailuser}
       - ROUNDCUBEMAIL_DB_PASSWORD=${DB_PASSWORD:-mailpassword}
       - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
       - ROUNDCUBEMAIL_SKIN=elastic
       - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve
     volumes:
       - ./config/mailer/roundcube/custom.config.inc.php:/var/roundcube/config/custom.config.inc.php:ro
     healthcheck:
       test: ["CMD-SHELL", "curl -sf http://localhost:80/ > /dev/null"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 20s
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       dovecot:
         condition: service_started
       postfix:
         condition: service_started
     networks:
       - mailserver_network
     restart: unless-stopped

  # SOGo — full groupware (webmail + calendar + contacts + ActiveSync)
  sogo:
     image: ghcr.io/inverse-inc/sogo:latest
     container_name: sogo
     profiles: ["sogo"]
     ports:
       - "${SOGO_PORT:-8881}:80"
     environment:
       - MYSQL_HOST=mysql
       - MYSQL_PORT=3306
       - MYSQL_DATABASE=${SOGO_DB_NAME:-sogo}
       - MYSQL_USER=${DB_USER:-mailuser}
       - MYSQL_PASSWORD=${DB_PASSWORD:-mailpassword}
       - SOGO_IMAP_SERVER=dovecot
       - SOGO_SMTP_SERVER=postfix
       - SOGO_MAIL_DOMAIN=${DOMAIN:-example.com}
       - SOGO_TIME_ZONE=${TIMEZONE:-UTC}
       - SOGO_LANGUAGE=English
     healthcheck:
       test: ["CMD-SHELL", "curl -sf http://localhost:80/SOGo/ > /dev/null || exit 1"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 30s
     depends_on:
       mysql:
         condition: service_healthy
       migrate:
         condition: service_completed_successfully
       dovecot:
         condition: service_started
       postfix:
         condition: service_started
     networks:
       - mailserver_network
     restart: unless-stopped

  # Documentation — Developer Handbook
  docs:
    build: ./docs
    container_name: docs
    ports:
      - "${DOCS_PORT:-8000}:80"
    environment:
      - SITE_NAME=Mailyte Email Server Handbook
      - SITE_DESCRIPTION=The complete developer handbook for the Mailyte Email Server
      - SITE_URL=${SITE_URL:-http://localhost:8000}
    volumes:
      - ./docs:/app/docs-source:ro
    networks:
      - mailserver_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ > /dev/null || curl -sf http://localhost:8000/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # H1: nginx's master process needs root to bind port 80 (<1024), and
    # certbot needs it for the same reason during renewal. Both drop to their
    # own unprivileged worker model internally, so no `USER` in docs/Dockerfile
    # -- capabilities instead. DAC_OVERRIDE and FOWNER were found live in
    # mailyte-email-server: entrypoint.sh's mkdocs build deletes and recreates
    # /app/site on every start, and os.unlink() there failed with EPERM under
    # cap_drop: ALL alone.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN", "FOWNER", "DAC_OVERRIDE"]

  # ========================================================================
  # Mailyte Console — the admin panel (ADR-004)
  #
  # One application, two deployments. The same console Mailyte staff use to
  # run the hosted platform is the panel a self-hoster uses to run their own
  # box: a CE self-hoster *is* the platform operator of their own instance.
  # Enterprise-only modules are hidden by GET /api/v1/capabilities, which
  # this edition reports without them.
  #
  # Prebuilt image, not a build context — the console lives in its own
  # repository and is released on its own cadence. Pin CONSOLE_VERSION in
  # .env for a reproducible deployment; `latest` is a convenience, not a
  # recommendation.
  #
  # First run, to create the owner account:
  #   docker compose exec api cat /app/data/operator-bootstrap-token
  # then open http://127.0.0.1:3100/bootstrap and paste it. The API writes
  # that 0600 file only while no operator exists, and consumes it on use.
  #
  # Port contract (conventions §2) — the four values agree:
  #   1. app bind port         3100  (the image's `next start -p 3100`)
  #   2. EXPOSE                3100  (the image's Dockerfile)
  #   3. container side below  3100
  #   4. healthcheck probe     3100
  # ========================================================================
  console:
    image: ghcr.io/techies-africa/mailyte-console:${CONSOLE_VERSION:-latest}
    container_name: console
    # Opt-in until the image is published. Without this, a plain
    # `docker compose up` fails the WHOLE stack for every existing CE user the
    # moment this file merges, because ghcr.io/techies-africa/mailyte-console cannot be pulled yet --
    # a mail server that stops booting is a far worse outcome than a console
    # that has to be asked for. Start it with:
    #     docker compose --profile console up -d console
    # Remove this key once the image is published to the public registry.
    profiles: ["console"]
    ports:
      # Bound to loopback on purpose (ADR-004). The console controls the
      # whole mail server; publishing it on 0.0.0.0 by default would make
      # exposing it the path of least resistance. Terminate TLS and restrict
      # by source address in a reverse proxy in front of it, and forward
      # X-Forwarded-For — operator sessions are IP-bound (ADR-002 §7), so a
      # proxy that does not set it binds every operator to the proxy's own
      # address and the control stops meaning anything.
      - "127.0.0.1:${CONSOLE_PORT:-3100}:3100"
    environment:
      # Where the API is from THIS container. Never reaches the browser: the
      # console proxies every call server-side, which is what keeps the API
      # off any browser-reachable network and lets the operator session
      # cookie stay same-origin.
      - PLATFORM_API_URL=http://api:8080
      # Optional deep-links, resolved by the OPERATOR's browser rather than
      # by this container, so they are host-side addresses.
      - NEXT_PUBLIC_DOCS_URL=${DOCS_URL:-http://localhost:8000}
      - NEXT_PUBLIC_RSPAMD_URL=${RSPAMD_URL:-http://localhost:11334}
      - NODE_ENV=production
    healthcheck:
      # Socket probe, never pgrep — pgrep is absent from these images and
      # yields exit 127 forever (conventions §3). node, not python3: this is
      # a Node image.
      test: ["CMD", "node", "-e", "require('net').connect(3100,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mailserver_network
    # The image already runs as a non-root user; these are the
    # container-level counterparts.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Next.js writes its build and image caches at runtime.
      - /tmp
      - /app/.next/cache
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rspamd_data:
    driver: local
  letsencrypt_data:
    driver: local
  # Writable state for the api container, which now runs as UID 10001 (H1).
  # See the note on the api service's volume list for why this is a named
  # volume rather than a host bind.
  api_data:
    driver: local
  sni_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SNI_CONFIG_PATH:-./storage/sni_config}
  mail_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MAIL_STORAGE_PATH:-./storage/mail_data}

networks:
  mailserver_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  # docker-proxy and the one service that talks to it (C1). Deliberately not
  # attached to mailserver_network, and `internal: true` so it has no route
  # off the host at all -- a compromised service on the main network cannot
  # reach the Docker API even indirectly. Subnet chosen not to overlap
  # mailserver_network's 172.20.0.0/16 above.
  internal_only:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
